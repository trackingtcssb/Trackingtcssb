                const handleDocUpload = (e) => {
                    const files = Array.from(e.target.files);
                    files.forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (uploadEvent) => {
                            const sizeMb = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
                            setFormData(prev => ({
                                ...prev,
                                documents: [...prev.documents, { name: file.name, size: sizeMb, dataUrl: uploadEvent.target.result }]
                            }));
                        };
                        reader.readAsDataURL(file);
                    });
                    e.target.value = null;
                };

                const handleSubmit = (e) => {
                    e.preventDefault();
                    const cCode = NORMALIZED_COUNTRY_CODES[(formData.customerCountry || 'Malaysia').toLowerCase()] || 'MY';
                    const dateFormatted = formData.dateReceived.replaceAll('-', '').substring(2);
                    const jobId = `TCS_${cCode}_${dateFormatted}_${101 + repairs.length}${formData.warrantyType === 'W' ? '_W' : ''}`;

                    if (isNewCustomer && formData.customerCompany) {
                        setCustomers([...customers, { id: `CUST-0${customers.length + 1}`, company: formData.customerCompany, name: formData.customerName, phone: formData.customerPhone, email: formData.customerEmail, street: formData.customerStreet, postcode: formData.customerPostcode, city: formData.customerCity, state: formData.customerState, country: formData.customerCountry }]);
                    }
                    const newRepair = {
                        ...formData, id: jobId, status: 'Draft', report: '', partsUsed: [], deliveryNotes: '',
                        assignedEngineer: '', mechanicalReports: [], transferredFromMechanical: false, pendingElectronicPickup: false, awaitingPart: false, awaitingPartRequestIds: [],
                        deliveryInfo: { courier: '', trackingNumber: '', shippedDate: '', packedBy: '' },
                        qcChecklist: { visualConfirmed: false, functionalConfirmed: false, calibrationConfirmed: false, documentationConfirmed: false, packagingConfirmed: false, result: '', notes: '', inspectorName: '', inspectorRole: '', timestamp: '' },
                        statusHistory: [{ status: 'Draft', timestamp: new Date().toISOString(), by: userRole, byName: currentUserName, type: 'status' }],
                        preRepairDiagnostic: { internal: { ...EMPTY_DIAG_SIDE }, customer: { ...EMPTY_DIAG_SIDE } },
                        diagnosticReport: { visualInspection: '', initialFindings: '', correctiveAction: '', testResults: '', photos: [] },
                        customerReport: { visualInspection: '', initialFindings: '', correctiveAction: '', testResults: '', photos: [], partsUsed: [] }
                    };
                    setRepairs([newRepair, ...repairs]);
                    navigateTo('dashboard');
                };

                return (
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-8 max-w-4xl mx-auto">
                        <div className="flex items-center justify-between border-b border-slate-200 pb-4 mb-8">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800 tracking-tight">Initiate Service Request</h2>
                                <p className="text-sm text-slate-500 mt-1">Complete intake parameters to generate a formal Work Order.</p>
                            </div>
                            <button onClick={() => navigateTo('dashboard')} className="text-slate-400 hover:text-slate-700 transition"><i className="fa-solid fa-xmark text-xl"></i></button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-8">
                            <div className="bg-slate-50 p-6 rounded-xl border border-slate-200">
                                <h3 className="text-sm font-bold text-brand-800 uppercase tracking-widest mb-6 flex items-center"><i className="fa-regular fa-building mr-2"></i>1. Corporate Client Data</h3>
                                <SearchableCustomerSelect customers={customers} formData={formData} setFormData={setFormData} isNewCustomer={isNewCustomer} setIsNewCustomer={setIsNewCustomer} />

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Company Entity</label><input required type="text" value={formData.customerCompany} onChange={e => setFormData({...formData, customerCompany: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" /></div>
                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Authorizing Personnel (PIC)</label><input required type="text" value={formData.customerName} onChange={e => setFormData({...formData, customerName: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" /></div>
                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Contact Number</label><input type="text" value={formData.customerPhone} onChange={e => setFormData({...formData, customerPhone: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" /></div>
                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Corporate Email</label><input type="text" value={formData.customerEmail} onChange={e => setFormData({...formData, customerEmail: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" /></div>
                                </div>
                                <div className="pt-5 border-t border-slate-200 space-y-5">
                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Facility Address Line 1</label><input type="text" value={formData.customerStreet} onChange={e => setFormData({...formData, customerStreet: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" /></div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                        <div><label className="block text-xs font-bold text-slate-700 mb-1">City / District</label><input type="text" value={formData.customerCity} onChange={e => setFormData({...formData, customerCity: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" /></div>
                                        <div><label className="block text-xs font-bold text-slate-700 mb-1">State / Province</label><input type="text" value={formData.customerState} onChange={e => setFormData({...formData, customerState: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" /></div>
                                        <div><label className="block text-xs font-bold text-slate-700 mb-1">Postal Code</label><input type="text" value={formData.customerPostcode} onChange={e => setFormData({...formData, customerPostcode: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" /></div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Country Registry</label>
                                            <select value={formData.customerCountry} onChange={e => setFormData({...formData, customerCountry: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white">
                                                {SORTED_COUNTRY_LIST.map(country => (<option key={country} value={country}>{country}</option>))}
                                            </select>
                                        </div>
                                    </div>
                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Purchase Order (PO) or Reference Tag</label><input type="text" value={formData.customerPo} onChange={e => setFormData({...formData, customerPo: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" /></div>
                                </div>
                            </div>

                            <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 space-y-6">
                                <h3 className="text-sm font-bold text-brand-800 uppercase tracking-widest flex items-center"><i className="fa-solid fa-microchip mr-2"></i>2. Equipment Specifications</h3>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-2">Responsible Department</label>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <button type="button" onClick={() => setFormData({...formData, department: 'Electronic'})} className={`p-4 rounded-lg border-2 text-left transition flex items-center gap-3 ${formData.department === 'Electronic' ? 'border-circuit-600 bg-circuit-50' : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                                            <div className={`w-9 h-9 rounded-full flex items-center justify-center ${formData.department === 'Electronic' ? 'bg-circuit-100 text-circuit-700' : 'bg-slate-100 text-slate-400'}`}><i className="fa-solid fa-bolt"></i></div>
                                            <div><div className="font-bold text-sm text-slate-800">Electronic Department</div><div className="text-[11px] text-slate-500">Controllers, drives, instrumentation</div></div>
                                        </button>
                                        <button type="button" onClick={() => setFormData({...formData, department: 'Mechanical'})} className={`p-4 rounded-lg border-2 text-left transition flex items-center gap-3 ${formData.department === 'Mechanical' ? 'border-signal-600 bg-signal-50' : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                                            <div className={`w-9 h-9 rounded-full flex items-center justify-center ${formData.department === 'Mechanical' ? 'bg-signal-100 text-signal-700' : 'bg-slate-100 text-slate-400'}`}><i className="fa-solid fa-gear"></i></div>
                                            <div><div className="font-bold text-sm text-slate-800">Mechanical Department</div><div className="text-[11px] text-slate-500">Valves, actuators, positioners</div></div>
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Intake Date</label><input required type="date" value={formData.dateReceived} onChange={e => setFormData({...formData, dateReceived: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" /></div>
                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Promised Completion Date (Optional)</label><input type="date" value={formData.promisedDate} onChange={e => setFormData({...formData, promisedDate: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" /></div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Service Level Agreement</label>
                                        <select value={formData.warrantyType} onChange={e => setFormData({...formData, warrantyType: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white">
                                            <option value="">Standard Commercial Repair</option>
                                            <option value="W">Warranty Claim Execution</option>
                                        </select>
                                    </div>
                                    <div className="md:col-span-2"><label className="block text-xs font-bold text-slate-700 mb-1">Equipment Description</label><input required type="text" value={formData.itemName} onChange={e => setFormData({...formData, itemName: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" placeholder="e.g., Main Logic Controller Module" /></div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">OEM Brand</label>
                                        <input list="brands-list" required type="text" value={formData.brand} onChange={e => setFormData({...formData, brand: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" />
                                        <datalist id="brands-list">{POPULAR_BRANDS.map(b => <option key={b} value={b} />)}</datalist>
                                    </div>
                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Model / Part Number</label><input type="text" value={formData.model} onChange={e => setFormData({...formData, model: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" /></div>
                                    <div className="md:col-span-2"><label className="block text-xs font-bold text-slate-700 mb-1">Serial Number (S/N)</label><input required type="text" value={formData.serial} onChange={e => setFormData({...formData, serial: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm font-mono bg-white" /></div>
                                </div>
                                <div><label className="block text-xs font-bold text-slate-700 mb-1">Client Reported Anomalies</label><textarea rows="3" value={formData.faultDescription} onChange={e => setFormData({...formData, faultDescription: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" placeholder="Detail the fault symptoms..."></textarea></div>

                                <div className="pt-4 border-t border-slate-200">
                                    <div className="flex justify-between items-center mb-3">
                                        <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider"><i className="fa-solid fa-camera mr-1.5"></i> Item Intake Photos (Reference)</label>
                                        <label className="bg-brand-800 hover:bg-brand-900 text-white px-3 py-1.5 rounded text-xs font-bold transition cursor-pointer shadow-sm flex items-center">
                                            <i className="fa-solid fa-upload mr-1.5"></i> Upload from Device
                                            <input type="file" accept="image/*" multiple onChange={handlePhotoUpload} className="hidden" />
                                        </label>
                                    </div>
                                    <div className="space-y-3">
                                        {formData.photos.map((photo, idx) => (
                                            <div key={idx} className="flex gap-3 items-center bg-white p-3 border border-slate-200 rounded-lg shadow-sm">
                                                <div className="w-14 h-14 bg-slate-100 rounded border overflow-hidden shrink-0 cursor-pointer" onClick={() => setPreviewImage(photo.url)}>
                                                    <img src={photo.url} alt="Preview" className="w-full h-full object-cover" />
                                                </div>
                                                <input type="text" placeholder="Caption / Description" value={photo.caption} onChange={e => { const p = [...formData.photos]; p[idx].caption = e.target.value; setFormData({...formData, photos: p}); }} className="flex-1 border border-slate-300 rounded p-2 text-xs" />
                                                <button type="button" onClick={() => { const p = formData.photos.filter((_, i) => i !== idx); setFormData({...formData, photos: p}); }} className="text-red-600 hover:text-red-800 p-2"><i className="fa-solid fa-trash-can"></i></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="pt-4 border-t border-slate-200">
                                    <div className="flex justify-between items-center mb-3">
                                        <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider"><i className="fa-solid fa-folder-open mr-1.5"></i> Equipment Documents (Manuals, Programs, Schematics)</label>
                                        <label className="bg-brand-800 hover:bg-brand-900 text-white px-3 py-1.5 rounded text-xs font-bold transition cursor-pointer shadow-sm flex items-center">
                                            <i className="fa-solid fa-upload mr-1.5"></i> + Add Document
                                            <input type="file" multiple onChange={handleDocUpload} className="hidden" />
                                        </label>
                                    </div>
                                    <div className="space-y-3">
                                        {formData.documents.map((doc, idx) => (
                                            <div key={idx} className="flex gap-3 items-center bg-white p-3 border border-slate-200 rounded-lg shadow-sm">
                                                <div className="flex-1">
                                                    <span className="font-bold text-slate-800 text-xs block"><i className="fa-regular fa-file-lines text-brand-600 mr-2"></i> {doc.name}</span>
                                                    <span className="text-[10px] text-slate-500">{doc.size}</span>
                                                </div>
                                                <button type="button" onClick={() => { const d = formData.documents.filter((_, i) => i !== idx); setFormData({...formData, documents: d}); }} className="text-red-600 hover:text-red-800 p-2"><i className="fa-solid fa-trash-can"></i></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="flex justify-end pt-4">
                                <button type="button" onClick={() => navigateTo('dashboard')} className="text-slate-600 font-semibold px-6 py-3 mr-4 hover:bg-slate-100 rounded transition">Discard</button>
                                <button type="submit" className="bg-brand-800 text-white px-8 py-3 rounded shadow-md text-sm font-bold hover:bg-brand-900 transition flex items-center"><i className="fa-solid fa-file-signature mr-2"></i> Generate Draft Job</button>
                            </div>
                        </form>
                    </div>
                );
        };

        // ---- ItemDetail --------------------------------------------------------
        // NOTE: this component lives at the top level (not nested inside App) so that
        // React never treats it as a "new component type" when App re-renders (e.g.
        // when the photo preview overlay opens/closes). Nesting it inside App used to
        // cause the whole sub-tab state (active tab, edit buffers, etc.) to reset on
        // every unrelated App state change.
        const ItemDetail = ({ repair, repairs, setRepairs, setSelectedRepair, perms, userRole, currentUserName, stock, setStock, navigateTo, setPreviewImage, loadData, onLogAudit, onCreateRequest, partRequests, viewersByJob, currentTabId, trackViewing, untrackViewing, onRequestEdit }) => {
                const selectedRepair = repair;
                const [activeSubTab, setActiveSubTab] = useState('workflow');
                const [showPartRequestModal, setShowPartRequestModal] = useState(false);
                const [reportMode, setReportMode] = useState('internal');
                const [quoteMode, setQuoteMode] = useState('internal');
                const [polishingCustomer, setPolishingCustomer] = useState(false);
                const [polishingQuote, setPolishingQuote] = useState(false);
                const [editData, setEditData] = useState({ ...selectedRepair });
                const [diag, setDiag] = useState({
                    visualInspection: selectedRepair.diagnosticReport?.visualInspection || '',
                    initialFindings: selectedRepair.diagnosticReport?.initialFindings || '',
                    correctiveAction: selectedRepair.diagnosticReport?.correctiveAction || '',
                    testResults: selectedRepair.diagnosticReport?.testResults || '',
                    photos: selectedRepair.diagnosticReport?.photos || []
                });
                const [custRep, setCustRep] = useState({
                    visualInspection: selectedRepair.customerReport?.visualInspection || '',
                    initialFindings: selectedRepair.customerReport?.initialFindings || '',
                    correctiveAction: selectedRepair.customerReport?.correctiveAction || '',
                    testResults: selectedRepair.customerReport?.testResults || '',
                    photos: selectedRepair.customerReport?.photos || [],
                    partsUsed: selectedRepair.customerReport?.partsUsed || []
                });
                const [quoteInternal, setQuoteInternal] = useState({ ...EMPTY_DIAG_SIDE, ...(selectedRepair.preRepairDiagnostic?.internal || {}) });
                const [quoteCustomer, setQuoteCustomer] = useState({ ...EMPTY_DIAG_SIDE, ...(selectedRepair.preRepairDiagnostic?.customer || {}) });
                const [pendingParts, setPendingParts] = useState([{ partId: "", qty: 1 }]);
                const [deliveryNotes, setDeliveryNotes] = useState(selectedRepair.deliveryNotes || '');
                const [deliveryInfo, setDeliveryInfo] = useState({ courier: '', trackingNumber: '', shippedDate: '', packedBy: '', ...(selectedRepair.deliveryInfo || {}) });
                const [qcChecklist, setQcChecklist] = useState({ visualConfirmed: false, functionalConfirmed: false, calibrationConfirmed: false, documentationConfirmed: false, packagingConfirmed: false, notes: '', result: '', inspectorName: '', inspectorRole: '', timestamp: '', ...(selectedRepair.qcChecklist || {}) });

                const lastRepairEntry = [...(selectedRepair.statusHistory || [])].reverse().find(h => h.status === 'Repair Completed' || h.status === 'Repairing');
                const sameTechnicianWarning = !!(perms.canQC && lastRepairEntry && lastRepairEntry.byName === currentUserName);

                // ---- Cross-device "who is editing" presence + read-only lock ----
                // Backed by Supabase Realtime Presence (see App), so this works across
                // different browsers/devices, not just other tabs in the same browser —
                // and updates live without needing a refresh.
                const viewers = (viewersByJob && viewersByJob[selectedRepair.id]) || [];
                const holder = viewers[0] || null;
                const isLockedByOther = !!(holder && holder.tabId !== currentTabId);
                const lockState = holder ? { holderName: holder.name, holderRole: ROLE_LABELS[holder.role] || holder.role, tabId: holder.tabId } : null;

                useEffect(() => {
                    trackViewing(selectedRepair.id, Date.now());
                    return () => { untrackViewing(); };
                }, [selectedRepair.id]);

                const requestTakeover = () => {
                    if (!holder) return;
                    onRequestEdit(selectedRepair.id, holder.tabId, holder.name);
                };

                const guardLock = () => {
                    if (isLockedByOther) { alert(`This item is currently being edited by ${lockState.holderName}. Request take-over first.`); return true; }
                    return false;
                };

                const updateStatus = (newStatus) => {
                    if (guardLock()) return;
                    if (!perms.allowedStatuses.includes(newStatus)) return alert(`Role restriction prohibits moving to ${newStatus}.`);
                    if (!window.confirm(`Are you sure you want to change status to: ${newStatus}?`)) return;

                    const updated = appendAuditEntry({ ...selectedRepair, status: newStatus, pendingElectronicPickup: false }, { type: 'status', status: newStatus, by: userRole, byName: currentUserName, detail: `Status changed to ${newStatus}` });
                    setRepairs(repairs.map(r => r.id === updated.id ? updated : r)); setSelectedRepair(updated);
                };

                const handleSaveDiag = () => {
                    if (guardLock()) return;
                    let updated = { ...selectedRepair, diagnosticReport: diag, customerReport: custRep };
                    updated = appendAuditEntry(updated, { type: 'report', status: 'Repair Report Updated', by: userRole, byName: currentUserName, detail: 'Internal & customer post-repair engineering reports updated' });
                    setRepairs(repairs.map(r => r.id === updated.id ? updated : r)); setSelectedRepair(updated);
                    alert("Engineering reports updated successfully.");
                };

                const handleSaveQuote = () => {
                    if (guardLock()) return;
                    let updated = { ...selectedRepair, preRepairDiagnostic: { internal: quoteInternal, customer: quoteCustomer } };
                    updated = appendAuditEntry(updated, { type: 'report', status: 'Diagnostic Report Updated', by: userRole, byName: currentUserName, detail: 'Pre-repair diagnostic / quotation report updated' });
                    setRepairs(repairs.map(r => r.id === updated.id ? updated : r)); setSelectedRepair(updated);
                    alert("Diagnostic report updated successfully.");
                };

                const handleSyncToCustomer = async () => {
                    if(!window.confirm("Use AI to rewrite the internal diagnostic details into polished customer-facing language (photos and parts are copied as-is)? You can edit the result afterwards.")) return;
                    const rawFields = { visualInspection: diag.visualInspection, initialFindings: diag.initialFindings, correctiveAction: diag.correctiveAction, testResults: diag.testResults };
                    const carryOver = { photos: [...(diag.photos || [])], partsUsed: (selectedRepair.partsUsed || []).map(p => ({ id: p.id, name: p.name, qty: p.qty })) };
                    setPolishingCustomer(true);
                    try {
                        const polished = await polishReportFields(
                            { itemName: selectedRepair.itemName, brand: selectedRepair.brand, model: selectedRepair.model, faultDescription: selectedRepair.faultDescription, warrantyType: selectedRepair.warrantyType },
                            rawFields
                        );
                        setCustRep({ ...rawFields, ...polished, ...carryOver });
                        alert("Internal report polished into customer-facing language. Review before saving.");
                    } catch (err) {
                        console.error('AI polish failed:', err);
                        if (window.confirm(`AI rewrite failed (${err.message}). Copy the raw internal text instead? You can edit it manually.`)) {
                            setCustRep({ ...rawFields, ...carryOver });
                        }
                    } finally {
                        setPolishingCustomer(false);
                    }
                };

                const handleSyncQuoteToCustomer = async () => {
                    if(!window.confirm("Use AI to rewrite the internal diagnostic findings into polished customer-facing language for the quotation? You can edit the result afterwards.")) return;
                    const rawFields = { visualInspection: quoteInternal.visualInspection, probableCause: quoteInternal.probableCause, recommendedAction: quoteInternal.recommendedAction, notes: quoteInternal.notes };
                    setPolishingQuote(true);
                    try {
                        const polished = await polishReportFields(
                            { itemName: selectedRepair.itemName, brand: selectedRepair.brand, model: selectedRepair.model, faultDescription: selectedRepair.faultDescription, warrantyType: selectedRepair.warrantyType },
                            rawFields
                        );
                        setQuoteCustomer({ ...quoteInternal, ...rawFields, ...polished });
                        alert("Internal diagnostic polished into customer-facing quotation language. Review before saving.");
                    } catch (err) {
                        console.error('AI polish failed:', err);
                        if (window.confirm(`AI rewrite failed (${err.message}). Copy the raw internal text instead? You can edit it manually.`)) {
                            setQuoteCustomer({ ...quoteInternal });
                        }
                    } finally {
                        setPolishingQuote(false);
                    }
                };

                const handleSaveAdmin = (e) => {
                    e.preventDefault();
                    if (guardLock()) return;
                    let updated = { ...selectedRepair, ...editData };
                    updated = appendAuditEntry(updated, { type: 'edit', status: 'Item & Commercial Details Updated', by: userRole, byName: currentUserName, detail: 'Commercial client data, equipment info, intake photos and/or documents were edited' });
                    setRepairs(repairs.map(r => r.id === updated.id ? updated : r)); setSelectedRepair(updated);
                    alert("Record updated.");
                };

                const handleAdminPhotoUpload = (e) => {
                    const files = Array.from(e.target.files);
                    files.forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (uploadEvent) => {
                            setEditData(prev => ({ ...prev, photos: [...(prev.photos || []), { url: uploadEvent.target.result, caption: file.name }] }));
                        };
                        reader.readAsDataURL(file);
                    });
                    e.target.value = null;
                };

                const handleAdminDocUpload = (e) => {
                    const files = Array.from(e.target.files);
                    files.forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (uploadEvent) => {
                            const sizeMb = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
                            setEditData(prev => ({ ...prev, documents: [...(prev.documents || []), { name: file.name, size: sizeMb, dataUrl: uploadEvent.target.result }] }));
                        };
                        reader.readAsDataURL(file);
                    });
                    e.target.value = null;
                };

                const handleSaveDelivery = () => {
                    if (guardLock()) return;
                    let updated = { ...selectedRepair, deliveryNotes, deliveryInfo };
                    updated = appendAuditEntry(updated, { type: 'edit', status: 'Delivery Info Updated', by: userRole, byName: currentUserName, detail: `Courier: ${deliveryInfo.courier || '—'} • Tracking: ${deliveryInfo.trackingNumber || '—'}${deliveryNotes ? ' • Notes: "' + deliveryNotes + '"' : ''}` });
                    setRepairs(repairs.map(r => r.id === updated.id ? updated : r)); setSelectedRepair(updated);
                    alert("Shipment details saved.");
                };

                const handleAssignToMe = () => {
                    if (guardLock()) return;
                    let updated = { ...selectedRepair, assignedEngineer: currentUserName };
                    updated = appendAuditEntry(updated, { type: 'edit', status: 'Job Assigned', by: userRole, byName: currentUserName, detail: `${currentUserName} self-assigned this job` });
                    setRepairs(repairs.map(r => r.id === updated.id ? updated : r)); setSelectedRepair(updated);
                };

                const handleTransferDepartment = (targetDept) => {
                    if (guardLock()) return;
                    if (!window.confirm(`Transfer this item to the ${targetDept} Department? It will re-enter that department's queue at the Diagnostic stage.`)) return;
                    const note = window.prompt(`Handover note for the ${targetDept} team (findings so far, reason for transfer):`, '') || '';
                    let updated = {
                        ...selectedRepair,
                        department: targetDept,
                        status: 'Diagnostic',
                        transferredFromMechanical: targetDept === 'Electronic',
                        pendingElectronicPickup: targetDept === 'Electronic'
                    };
                    updated = appendAuditEntry(updated, { type: 'transfer', status: `Transferred to ${targetDept} Department`, by: userRole, byName: currentUserName, detail: note ? `Handover note: "${note}"` : `Item handed over to the ${targetDept} department for diagnostic.` });
                    setRepairs(repairs.map(r => r.id === updated.id ? updated : r)); setSelectedRepair(updated);
                    alert(`Transferred to ${targetDept} Department.`);
                };

                const handleMechanicalReportUpload = (e) => {
                    const files = Array.from(e.target.files);
                    files.forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const sizeMb = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
                            const entry = { name: file.name, size: sizeMb, dataUrl: ev.target.result, uploadedBy: currentUserName, uploadedAt: new Date().toISOString() };
                            // Only setRepairs (functional update, safe against concurrent multi-file uploads) — ItemDetail's
                            // parent keeps `selectedRepair` in sync with `repairs` automatically, so it doesn't need setting here.
                            setRepairs(prev => prev.map(r => {
                                if (r.id !== selectedRepair.id) return r;
                                const withReport = { ...r, mechanicalReports: [...(r.mechanicalReports || []), entry] };
                                return appendAuditEntry(withReport, { type: 'edit', status: 'Mechanical Report Uploaded', by: userRole, byName: currentUserName, detail: `Uploaded mechanical report: ${file.name}` });
                            }));
                        };
                        reader.readAsDataURL(file);
                    });
                    e.target.value = null;
                };

                const handleDeleteMechanicalReport = (idx) => {
                    if (guardLock()) return;
                    if (!window.confirm('Remove this mechanical report attachment?')) return;
                    const reportName = (selectedRepair.mechanicalReports || [])[idx]?.name || 'report';
                    let updated = { ...selectedRepair, mechanicalReports: (selectedRepair.mechanicalReports || []).filter((_, i) => i !== idx) };
                    updated = appendAuditEntry(updated, { type: 'edit', status: 'Mechanical Report Removed', by: userRole, byName: currentUserName, detail: `Removed mechanical report: ${reportName}` });
                    setRepairs(repairs.map(r => r.id === updated.id ? updated : r)); setSelectedRepair(updated);
                };

                const handleSaveQC = (result) => {
                    if (guardLock()) return;
                    if (!perms.canQC) return;
                    const completedChecklist = { ...qcChecklist, result, inspectorName: currentUserName, inspectorRole: userRole, timestamp: new Date().toISOString() };
                    let updated = { ...selectedRepair, qcChecklist: completedChecklist, status: result === 'Pass' ? 'Delivery Arrangement' : 'Repairing' };
                    updated = appendAuditEntry(updated, { type: 'report', status: `QC Sign-off: ${result}`, by: userRole, byName: currentUserName, detail: `QC checklist completed by ${currentUserName}.${sameTechnicianWarning ? ' Note: same technician also performed the repair on this item.' : ''}${qcChecklist.notes ? ' Remarks: "' + qcChecklist.notes + '"' : ''}` });
                    updated = appendAuditEntry(updated, { type: 'status', status: updated.status, by: userRole, byName: currentUserName, detail: result === 'Pass' ? 'QC passed — released for delivery arrangement' : 'QC failed — sent back to Repairing for rework' });
                    setRepairs(repairs.map(r => r.id === updated.id ? updated : r)); setSelectedRepair(updated);
                    setQcChecklist(completedChecklist);
                    alert(`QC ${result} recorded. Job moved to ${updated.status}.`);
                };

                const handleConsumeParts = async () => {
                    if (guardLock()) return;
                    if (!perms.canConsumeParts) return alert("Your role is not authorized to allocate parts or deduct stock.");
                    const validParts = pendingParts.filter(p => p.partId !== "" && p.qty > 0);
                    if (validParts.length === 0) return alert("Select at least one valid component SKU.");

                    // Guard: never allow a deduction that would push current stock below zero.
                    const stockErrors = [];
                    validParts.forEach(item => {
                        const found = stock.find(s => s.id === item.partId);
                        const requestedQty = parseInt(item.qty) || 0;
                        if (!found) { stockErrors.push(`${item.partId}: component not found in inventory.`); }
                        else if (requestedQty > found.qty) { stockErrors.push(`${found.id} (${found.name}): only ${found.qty} in stock, cannot allocate ${requestedQty}.`); }
                    });
                    if (stockErrors.length > 0) {
                        alert("Cannot commit allocation - insufficient stock:\n\n" + stockErrors.join("\n") + "\n\nAdjust the quantities and try again.");
                        return;
                    }

                    const newLogs = validParts.map(item => {
                        const found = stock.find(s => s.id === item.partId);
                        return { id: item.partId, name: found ? found.name : item.partId, qty: parseInt(item.qty), installedBy: currentUserName };
                    });

                    try {
                        await fetch(GOOGLE_SHEET_API, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                action: 'deductStock',
                                jobId: selectedRepair.id,
                                parts: validParts
                            })
                        });
                    } catch (err) {
                        console.error("Error communicating with Google Sheet backend:", err);
                    }

                    const updatedStock = stock.map(s => {
                        const match = validParts.find(p => p.partId === s.id);
                        if (match) {
                            return { ...s, qty: Math.max(0, s.qty - parseInt(match.qty)) };
                        }
                        return s;
                    });
                    setStock(updatedStock);

                    const updatedPartsUsed = [...(selectedRepair.partsUsed || []), ...newLogs];
                    const partsSummary = newLogs.map(l => `${l.qty}x ${l.id}`).join(', ');
                    let updated = { ...selectedRepair, partsUsed: updatedPartsUsed };
                    updated = appendAuditEntry(updated, { type: 'parts', status: 'Parts Allocated to BOM', by: userRole, byName: currentUserName, detail: `Allocated ${partsSummary} and deducted from inventory stock` });
                    setRepairs(repairs.map(r => r.id === updated.id ? updated : r));
                    setSelectedRepair(updated);
                    setPendingParts([{ partId: "", qty: 1 }]);

                    alert("Components allocated, database stock deducted, and added to Bill of Materials (BOM).");
                    setActiveSubTab('workflow');
                    loadData();
                };

                // Report tabs are scoped to the phase they belong to rather than staying unlocked
                // forever once reached: the quotation only matters while still Diagnostic/Waiting PO,
                // and the parts-allocation tool only matters while actively working ('Proceed Repair'
                // / 'Repairing'). The write-up itself (showRepairReport) is a permanent record QC and
                // later phases still need to read, so that one has no upper bound once it unlocks.
                const showQuoteTab = ['Diagnostic', 'Waiting PO'].includes(selectedRepair.status);
                const showRepairTools = ['Proceed Repair', 'Repairing'].includes(selectedRepair.status);
                const showRepairReport = WORKFLOW_STEPS.indexOf(selectedRepair.status) >= WORKFLOW_STEPS.indexOf('Repairing');
                const isFailedPath = selectedRepair.status === 'Repair Failed' || selectedRepair.statusHistory.some(h => h.status === 'Repair Failed');
                const displaySteps = getDisplaySteps(selectedRepair);

                const renderActionButtons = () => {
                    const status = selectedRepair.status;
                    const dis = isLockedByOther;

                    // A role that isn't authorized to act while the job sits in this status gets no
                    // clickable controls at all, instead of a button that fails only after it's clicked.
                    if (!perms.allowedStatuses.includes(status)) return null;

                    if (status === 'QC') {
                        if (!perms.canQC) {
                            return (
                                <span className="text-xs font-bold text-slate-400 italic flex items-center bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5">
                                    <i className="fa-solid fa-hourglass-half mr-2"></i> Awaiting independent QC Inspector sign-off
                                </span>
                            );
                        }
                        return (
                            <button onClick={() => setActiveSubTab('qc')} className="bg-purple-700 hover:bg-purple-800 text-white px-6 py-3 rounded-lg text-sm font-bold transition shadow-lg flex items-center">
                                <i className="fa-solid fa-clipboard-check mr-2"></i> Open QC Sign-off
                            </button>
                        );
                    }

                    if (status === 'Diagnostic') {
                        return (
                            <div className="flex gap-3 flex-wrap">
                                <button disabled={dis} onClick={() => updateStatus('Repair Failed')} className="bg-red-700 hover:bg-red-800 text-white px-5 py-2.5 rounded-lg text-sm font-bold transition shadow-md flex items-center disabled:opacity-40 disabled:cursor-not-allowed">
                                    <i className="fa-solid fa-ban mr-2"></i> Declare BER (Beyond Repair)
                                </button>
                                <button disabled={dis} onClick={() => updateStatus('Waiting PO')} className="bg-brand-800 hover:bg-brand-900 text-white px-5 py-2.5 rounded-lg text-sm font-bold transition shadow-md flex items-center disabled:opacity-40 disabled:cursor-not-allowed">
                                    Advance: Waiting PO <i className="fa-solid fa-angles-right ml-2"></i>
                                </button>
                            </div>
                        );
                    }
                    if (status === 'Repairing') {
                        if (selectedRepair.awaitingPart) {
                            return (
                                <div className="flex gap-3 items-center flex-wrap">
                                    <span className="text-xs font-bold text-amber-700 italic flex items-center bg-amber-50 border border-amber-200 rounded-lg px-4 py-2.5">
                                        <i className="fa-solid fa-hourglass-half mr-2"></i> Waiting Part — repair paused ({(selectedRepair.awaitingPartRequestIds || []).join(', ')})
                                    </span>
                                    {perms.canRequestParts && (
                                        <button disabled={dis} onClick={() => setShowPartRequestModal(true)} className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2.5 rounded-lg text-xs font-bold transition shadow-sm flex items-center disabled:opacity-40 disabled:cursor-not-allowed">
                                            <i className="fa-solid fa-boxes-packing mr-1.5"></i> Request Another Part
                                        </button>
                                    )}
                                    <button disabled={dis} onClick={() => {
                                        if (guardLock()) return;
                                        const updated = appendAuditEntry({ ...selectedRepair, awaitingPart: false, awaitingPartRequestIds: [] }, { type: 'parts', status: 'Repair Resumed', by: userRole, byName: currentUserName, detail: 'Engineer resumed repair without waiting for the part request.' });
                                        setRepairs(repairs.map(r => r.id === updated.id ? updated : r)); setSelectedRepair(updated);
                                    }} className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2.5 rounded-lg text-xs font-bold transition shadow-sm flex items-center disabled:opacity-40 disabled:cursor-not-allowed">
                                        <i className="fa-solid fa-play mr-1.5"></i> Resume Repair
                                    </button>
                                </div>
                            );
                        }
                        return (
                            <div className="flex gap-3 flex-wrap">
                                <button disabled={dis} onClick={() => updateStatus('Repair Failed')} className="bg-red-700 hover:bg-red-800 text-white px-5 py-2.5 rounded-lg text-sm font-bold transition shadow-md flex items-center disabled:opacity-40 disabled:cursor-not-allowed">
                                    <i className="fa-solid fa-ban mr-2"></i> Declare Repair Failed (BER)
                                </button>
                                {perms.canRequestParts && (
                                    <button disabled={dis} onClick={() => setShowPartRequestModal(true)} className="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold transition shadow-md flex items-center disabled:opacity-40 disabled:cursor-not-allowed">
                                        <i className="fa-solid fa-boxes-packing mr-2"></i> Request Part
                                    </button>
                                )}
                                <button disabled={dis} onClick={() => updateStatus('Repair Completed')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold transition shadow-md flex items-center disabled:opacity-40 disabled:cursor-not-allowed">
                                    Repair Completed (Successful) <i className="fa-solid fa-check ml-2"></i>
                                </button>
                            </div>
                        );
                    }
                    if (status === 'Repair Completed' || status === 'Repair Failed') {
                        return (
                            <div className="flex gap-3 flex-wrap">
                                <button disabled={dis} onClick={() => updateStatus('Repairing')} className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2.5 rounded-lg text-xs font-bold transition shadow-sm flex items-center disabled:opacity-40 disabled:cursor-not-allowed">
                                    <i className="fa-solid fa-rotate-left mr-1.5"></i> Revert to Repairing
                                </button>
                                <button disabled={dis} onClick={() => updateStatus(status === 'Repair Completed' ? 'Repair Failed' : 'Repair Completed')} className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2.5 rounded-lg text-xs font-bold transition shadow-sm flex items-center disabled:opacity-40 disabled:cursor-not-allowed">
                                    <i className="fa-solid fa-right-left mr-1.5"></i> Switch to {status === 'Repair Completed' ? 'Failed' : 'Completed'}
                                </button>
                                <button disabled={dis} onClick={() => updateStatus('QC')} className="bg-brand-800 hover:bg-brand-900 text-white px-5 py-2.5 rounded-lg text-sm font-bold transition shadow-md flex items-center disabled:opacity-40 disabled:cursor-not-allowed">
                                    Proceed to QC <i className="fa-solid fa-angles-right ml-2"></i>
                                </button>
                            </div>
                        );
                    }

                    const nextStep = NEXT_WORKFLOW_STEP[status];
                    if (nextStep && perms.allowedStatuses.includes(nextStep)) {
                        return (
                            <button disabled={dis} onClick={() => updateStatus(nextStep)} className="bg-brand-800 hover:bg-brand-900 text-white px-6 py-3 rounded-lg text-sm font-bold transition shadow-lg flex items-center disabled:opacity-40 disabled:cursor-not-allowed">
                                Advance Phase: {nextStep} <i className="fa-solid fa-angles-right ml-2"></i>
                            </button>

                    }
                    if (nextStep) {
                        return (
                            <span className="text-xs font-bold text-slate-400 italic flex items-center bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5">
                                <i className="fa-solid fa-hourglass-half mr-2"></i> Awaiting authorized role to advance this job
                            </span>

                    return null;

                return (

                                        <span><i className="fa-regular fa-building mr-1.5 text-brand-600"></i> {selectedRepair.customerCompany}</span>

                                                <button onClick={handleAssignToMe} className="text-brand-700 underline font-bold">Assign to me</button>

                                                <i className="fa-solid fa-right-left"></i>
                                                Transfer to {selectedRepair.department === 'Mechanical' ? 'Electronic' : 'Mechanical'} Dept
                                            </button>

                                    </div>
                                </div>
                                {renderActionButtons()}

                            <div className="flex border-b border-slate-200 mt-8 gap-8 overflow-x-auto custom-scrollbar">
                                {[
                                    { id: 'workflow', icon: 'fa-route', label: 'Workflow & Specs' },
                                    { id: 'admin', icon: 'fa-shield-halved', label: 'Commercial & Item Details', show: perms.canEditAdminPanel },
                                    { id: 'intake', icon: 'fa-receipt', label: 'Intake Receipt', show: perms.canEditAdminPanel },
                                    { id: 'mechanical-report', icon: 'fa-file-arrow-up', label: 'Mechanical Report', show: !perms.isDeliveryRole && (selectedRepair.department === 'Mechanical' || (selectedRepair.mechanicalReports && selectedRepair.mechanicalReports.length > 0)) },
                                    { id: 'quote', icon: 'fa-file-invoice-dollar', label: 'Diagnostic Report (Quotation)', show: perms.canViewDiagnostic && showQuoteTab && selectedRepair.department !== 'Mechanical' },
                                    { id: 'diagnostic', icon: 'fa-file-medical', label: 'Repair & Engineering Report', show: perms.canViewDiagnostic && showRepairReport && selectedRepair.department !== 'Mechanical' },
                                    { id: 'repair', icon: 'fa-wrench', label: 'Parts & Execution', show: showRepairTools && perms.canConsumeParts },
                                    { id: 'qc', icon: 'fa-clipboard-check', label: 'QC Sign-off', show: (perms.canViewDiagnostic || perms.canQC || userRole === 'mechanical') && (WORKFLOW_STEPS.indexOf(selectedRepair.status) >= WORKFLOW_STEPS.indexOf('Repair Completed') || !!(selectedRepair.qcChecklist && selectedRepair.qcChecklist.result)) },
                                    { id: 'delivery', icon: 'fa-truck-fast', label: 'Delivery Handling', show: perms.isDeliveryRole }
                                ].filter(t => t.show !== false).map(tab => (
                                    <button key={tab.id} onClick={() => setActiveSubTab(tab.id)} className={`pb-3 text-sm font-bold border-b-[3px] transition-colors whitespace-nowrap ${activeSubTab === tab.id ? 'border-brand-600 text-brand-800' : 'border-transparent text-slate-400 hover:text-slate-600'}`}>
                                        <i className={`fa-solid ${tab.icon} mr-2`}></i>{tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {activeSubTab === 'workflow' && perms.isDeliveryRole && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 no-print">
                                <div className="lg:col-span-2 space-y-6">
                                    <div className="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
                                        <h3 className="text-xs font-black text-brand-800 uppercase tracking-widest mb-6 flex items-center"><i className="fa-solid fa-truck-fast mr-2"></i> Delivery Handling Summary</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm">
                                            <div>
                                                <div className="text-[10px] uppercase font-black tracking-wider text-slate-500 mb-1">Equipment</div>
                                                <div className="font-bold text-slate-900">{selectedRepair.itemName}</div>
                                                <div className="text-slate-600 mt-1">{selectedRepair.brand} {selectedRepair.model} — S/N: {selectedRepair.serial}</div>
                                            </div>
                                            <div>
                                                <div className="text-[10px] uppercase font-black tracking-wider text-slate-500 mb-1">Client Reference</div>
                                                <div className="font-bold text-slate-900">{selectedRepair.customerPo || 'N/A'}</div>
                                                <div className="text-slate-600 mt-1">Job ID: {selectedRepair.id}</div>
                                            </div>
                                            <div className="md:col-span-2 pt-4 border-t border-slate-100">
                                                <div className="text-[10px] uppercase font-black tracking-wider text-slate-500 mb-1">Ship To</div>
                                                <div className="font-bold text-slate-900">{selectedRepair.customerCompany}</div>
                                                <div className="text-slate-600 mt-1">{selectedRepair.customerStreet}, {selectedRepair.customerPostcode} {selectedRepair.customerCity}, {selectedRepair.customerState}, {selectedRepair.customerCountry}</div>
                                                <div className="text-slate-600 mt-1"><strong>Attn:</strong> {selectedRepair.customerName} • {selectedRepair.customerPhone}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
                                    <h3 className="text-xs font-black text-brand-800 uppercase tracking-widest mb-6 flex items-center"><i className="fa-solid fa-clock-rotate-left mr-2"></i> Compliance Audit Trail</h3>
                                    <AuditTrailList history={selectedRepair.statusHistory} />
                                </div>
                            </div>
                        )}

                        {activeSubTab === 'workflow' && !perms.isDeliveryRole && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 no-print">
                                <div className="lg:col-span-2 space-y-6">
                                    <div className="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
                                        <h3 className="text-xs font-black text-brand-800 uppercase tracking-widest mb-8 flex items-center"><i className="fa-solid fa-timeline mr-2"></i> Branched Lifecycle Milestones</h3>
                                        <div className="relative flex justify-between w-full pb-4 overflow-x-auto custom-scrollbar">
                                            {displaySteps.map((step, idx) => {
                                                let currentIdx = displaySteps.indexOf(selectedRepair.status);
                                                if (currentIdx === -1) {
                                                    currentIdx = WORKFLOW_STEPS.indexOf(selectedRepair.status);
                                                }

                                                const isPassed = idx < currentIdx;
                                                const isCurrent = step === selectedRepair.status;
                                                const isFailureNode = step === 'Repair Failed';

                                                let circleClass = 'bg-slate-200 text-slate-400';
                                                if (isCurrent) {
                                                    circleClass = isFailureNode ? 'bg-red-600 text-white ring-4 ring-red-100 shadow-md' : 'bg-brand-600 text-white ring-4 ring-brand-100 shadow-md';
                                                } else if (isPassed) {
                                                    circleClass = 'bg-emerald-500 text-white';
                                                }

                                                return (
                                                    <div key={step} className="flex flex-col items-center relative z-10 flex-1 min-w-[90px]">
                                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all ${circleClass}`}>
                                                            {isPassed ? <i className="fa-solid fa-check"></i> : (isCurrent && isFailureNode ? <i className="fa-solid fa-xmark"></i> : idx + 1)}
                                                        </div>
                                                        <span className={`text-[11px] mt-3 text-center font-bold leading-tight ${isCurrent ? (isFailureNode ? 'text-red-700' : 'text-brand-800') : isPassed ? 'text-slate-700' : 'text-slate-400'}`}>{step}</span>
                                                    </div>

                                                    {jobRequests.map(g => (
                                                        <div key={g.requestId} className="border border-slate-200 rounded-lg p-4 bg-slate-50">

                                                                    <span className={`ml-2 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border ${PURCHASE_STATUS_STYLE[g.status] || PURCHASE_STATUS_STYLE.Requested}`}>{g.status}</span>

                                                                </div>

                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}

                                            </div>

                                    {selectedRepair.photos && selectedRepair.photos.length > 0 && (
                                        <div className="bg-white p-8 rounded-xl shadow-sm border border-slate-200">

                                                        <div className="flex items-center gap-4">
                                                            <span className="text-slate-500 font-medium">{doc.size}</span>

                                                        </div>

                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 fade-in">

                            <div className="w-full md:w-1/2 bg-slate-50 p-6 border-r border-slate-200 flex flex-col items-center justify-center relative">
                                <button onClick={onClose} className="absolute top-4 left-4 md:hidden bg-slate-200 text-slate-700 rounded-full p-2"><i className="fa-solid fa-xmark"></i></button>
                                <div className="w-full bg-white p-4 rounded-xl border border-slate-200 text-center shadow-sm">
                                    <div className="text-[10px] font-black uppercase text-slate-400 tracking-wider mb-1">Component ID Barcode Tag</div>
                                    <div className="font-mono font-black text-brand-800 text-lg tracking-widest">{item.id}</div>
                                </div>
                            </div>

                            <div className="w-full md:w-1/2 p-6 md:p-8 flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-center border-b border-slate-200 pb-4 mb-6">
                                        <h3 className="font-mono font-black text-xl text-slate-900">{item.id}</h3>
                                        <button onClick={onClose} className="hidden md:flex text-slate-400 hover:text-slate-700 text-xl"><i className="fa-solid fa-xmark"></i></button>
                                    </div>

                                    <div className="space-y-4 text-sm divide-y divide-slate-100">
                                        <div className="flex justify-between pt-2"><span className="text-slate-500 font-medium">Component ID</span><span className="font-mono font-bold text-slate-800">{item.id}</span></div>
                                        <div className="flex justify-between pt-2"><span className="text-slate-500 font-medium">Type</span><span className="font-semibold text-slate-800">{item.type || '—'}</span></div>
                                        <div className="flex justify-between pt-2"><span className="text-slate-500 font-medium">Brand</span><span className="font-semibold text-slate-800">{item.brand || '—'}</span></div>
                                        <div className="flex justify-between pt-2"><span className="text-slate-500 font-medium">Part Number</span><span className="font-semibold text-slate-800">{item.partNumber || '—'}</span></div>
                                        <div className="flex justify-between pt-2"><span className="text-slate-500 font-medium">Package Type</span><span className="font-semibold text-slate-800">{item.packageType || '—'}</span></div>
                                        <div className="flex justify-between pt-2"><span className="text-slate-500 font-medium">Size</span><span className="font-semibold text-slate-800">{item.size || '—'}</span></div>
                                        <div className="flex justify-between pt-2"><span className="text-slate-500 font-medium">Description</span><span className="font-semibold text-slate-800">{item.description || '—'}</span></div>
                                        <div className="flex justify-between pt-2"><span className="text-slate-500 font-medium">Location</span><span className="font-semibold text-slate-800">{item.location || '—'}</span></div>
                                        <div className="flex justify-between pt-2"><span className="text-slate-500 font-medium">Current Stock</span><span className="font-black text-brand-700">{item.qty}</span></div>
                                        <div className="flex justify-between pt-2"><span className="text-slate-500 font-medium">Initial Stock</span><span className="font-bold text-slate-800">{item.initialStock || '—'}</span></div>
                                    </div>
                                </div>

                                <div className="mt-8 pt-4 border-t border-slate-200">
                                    <div className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                                        <div className="text-xs font-bold text-slate-600 mb-2 flex items-center justify-between">
                                            <span>Related Transaction Logs</span>
                                            <span className="bg-brand-100 text-brand-800 px-2 py-0.5 rounded-full text-[10px] font-bold">{itemLogs.length}</span>
                                        </div>
                                        {itemLogs.length === 0 ? (
                                            <p className="text-xs text-slate-400 text-center py-2 italic">No items recorded</p>
                                        ) : (
                                            <div className="space-y-2 max-h-40 overflow-y-auto">
                                                {itemLogs.map((log, idx) => (
                                                    <div key={idx} className="bg-white p-2.5 rounded border border-slate-200 text-xs flex justify-between items-center">
                                                        <div>
                                                            <span className="font-bold text-red-600">{log["Action"] || "Out"} ({log["Quantity"] || log["Qty"] || 1})</span>
                                                            <div className="text-[10px] text-slate-500">Job: {log["Job ID"] || "N/A"} • By: {log["Engineer Name"] || "Haziq"}</div>
                                                        </div>
                                                        <span className="text-[10px] text-slate-400">{log["Timestamp"] ? new Date(log["Timestamp"]).toLocaleDateString() : ""}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
        };

        const Inventory = ({ stock, loadData, selectedItemDetail, setSelectedItemDetail, transactions, stockError, perms, onCreateRequest }) => {
                const [searchTerm, setSearchTerm] = useState('');
                const [currentPage, setCurrentPage] = useState(1);
                const [sortConfig, setSortConfig] = useState({ key: 'id', direction: 'asc' });
                const [typeFilter, setTypeFilter] = useState('All');
                const [brandFilter, setBrandFilter] = useState('All');
                const [stockStatusFilter, setStockStatusFilter] = useState('All');
                const [restockTarget, setRestockTarget] = useState(null);

                const validStock = stock.filter(item => item.id && item.id.toString().trim() !== "" && (item.name || item.partNumber));

                const uniqueTypes = [...new Set(validStock.map(i => i.type).filter(Boolean))].sort();
                const uniqueBrands = [...new Set(validStock.map(i => i.brand).filter(Boolean))].sort();

                const filtered = validStock.filter(item => {
                    const term = searchTerm.toLowerCase();
                    const matchesSearch = (
                        (item.id && String(item.id).toLowerCase().includes(term)) ||
                        (item.type && String(item.type).toLowerCase().includes(term)) ||
                        (item.partNumber && String(item.partNumber).toLowerCase().includes(term)) ||
                        (item.packageType && String(item.packageType).toLowerCase().includes(term)) ||
                        (item.brand && String(item.brand).toLowerCase().includes(term)) ||
                        (item.location && String(item.location).toLowerCase().includes(term)) ||
                        (item.description && String(item.description).toLowerCase().includes(term))
                    );
                    const matchesType = typeFilter === 'All' || item.type === typeFilter;
                    const matchesBrand = brandFilter === 'All' || item.brand === brandFilter;
                    const matchesStockStatus = stockStatusFilter === 'All'
                        || (stockStatusFilter === 'Out' && item.qty <= 0)
                        || (stockStatusFilter === 'Low' && item.qty > 0 && item.qty <= 5)
                        || (stockStatusFilter === 'In Stock' && item.qty > 5);
                    return matchesSearch && matchesType && matchesBrand && matchesStockStatus;
                });

                const sorted = [...filtered].sort((a, b) => {
                    let aVal = String(a[sortConfig.key] || '').toLowerCase();
                    let bVal = String(b[sortConfig.key] || '').toLowerCase();

                    if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });

                const handleSort = (key) => {
                    let direction = 'asc';
                    if (sortConfig.key === key && sortConfig.direction === 'asc') {
                        direction = 'desc';
                    }
                    setSortConfig({ key, direction });
                    setCurrentPage(1);
                };

                const itemsPerPage = 20;
                const totalPages = Math.ceil(sorted.length / itemsPerPage) || 1;
                const paginatedItems = sorted.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

                return (
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-8 fade-in max-w-6xl mx-auto">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b pb-4 gap-4">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800 tracking-tight">Global Inventory Matrix</h2>
                                <p className="text-sm text-slate-500 mt-1">Live data linked from centralized warehouse.</p>
                            </div>
                            <div className="flex items-center gap-3 w-full md:w-auto flex-wrap">
                                <div className="relative flex-1 md:w-56">
                                    <i className="fa-solid fa-search absolute left-3 top-3 text-slate-400 text-sm"></i>
                                    <input
                                        type="text"
                                        placeholder="Search SKU, Type, Part Number, Location..."
                                        value={searchTerm}
                                        onChange={e => { setSearchTerm(e.target.value); setCurrentPage(1); }}
                                        className="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none shadow-sm"
                                    />
                                </div>
                                <select value={typeFilter} onChange={e => { setTypeFilter(e.target.value); setCurrentPage(1); }} className="border border-slate-300 rounded-lg text-sm px-3 py-2 shadow-sm bg-white focus:ring-2 focus:ring-brand-500 outline-none">
                                    <option value="All">All Types</option>
                                    {uniqueTypes.map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                                <select value={brandFilter} onChange={e => { setBrandFilter(e.target.value); setCurrentPage(1); }} className="border border-slate-300 rounded-lg text-sm px-3 py-2 shadow-sm bg-white focus:ring-2 focus:ring-brand-500 outline-none">
                                    <option value="All">All Brands</option>
                                    {uniqueBrands.map(b => <option key={b} value={b}>{b}</option>)}
                                </select>
                                <select value={stockStatusFilter} onChange={e => { setStockStatusFilter(e.target.value); setCurrentPage(1); }} className="border border-slate-300 rounded-lg text-sm px-3 py-2 shadow-sm bg-white focus:ring-2 focus:ring-brand-500 outline-none">
