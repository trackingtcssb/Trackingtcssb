<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Control Solutions - Enterprise Service Management</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'] },
                    colors: {
                        brand: { 50: '#f0f4f8', 100: '#d9e2ec', 500: '#334e68', 600: '#243b53', 800: '#102a43', 900: '#0a192f' },
                        /* Industrial accent used for primary calls-to-action & critical highlights — evokes a control-panel warning light. */
                        signal: { 50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' },
                        /* Cool secondary accent for informational / technical elements (schematic-line blue). */
                        circuit: { 50: '#ecfeff', 100: '#cffafe', 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
    body {
        background-color: #f4f7f9;
        /* Faint engineering blueprint grid — a subtle nod to schematic drawings, not a decoration you should notice. */
        background-image:
            linear-gradient(rgba(15, 46, 61, 0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(15, 46, 61, 0.035) 1px, transparent 1px);
        background-size: 32px 32px;
    }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .led-dot { box-shadow: 0 0 5px 1px currentColor; }

    @media screen { .print-only { display: none !important; } }
    @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        body, html, #root, main { height: auto !important; overflow: visible !important; background: white !important; }
        .print-section { width: 100%; margin: 0; padding: 0; border: none !important; box-shadow: none !important; background: white !important; }
        .print-header { border-bottom: 3px solid #102a43; padding-bottom: 15px; margin-bottom: 20px; }
        @page { margin: 15mm; size: A4; }
    }
    </style>
</head>
<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycbyC8x_A-FHxszNxo0obKdNVCSE_e9MM2eFsxWaH2PWDAXHnAsPcxISIdnObtCuN_lAr/exec";

        // Relative path only works when this page and /api/polish-report are deployed
        // together on the same origin (e.g. this whole repo hosted on Vercel). If the
        // frontend stays on GitHub Pages while the function lives on Vercel, replace
        // this with the function's full URL, e.g. "https://your-app.vercel.app/api/polish-report".
        const POLISH_REPORT_ENDPOINT = "/api/polish-report";
        const ADMIN_USERS_ENDPOINT = "/api/admin-users";

        // Supabase holds real login accounts (Supabase Auth) plus the `repairs` and
        // `customers` tables — the only two pieces of app data that didn't already have a
        // backend (inventory/transactions/part requests persist via GOOGLE_SHEET_API above).
        // The anon key below is meant to be public — it identifies the project, it does not
        // grant access on its own. Row Level Security policies (see supabase/schema.sql) are
        // what actually protect the data.
        const SUPABASE_URL = "https://lhybjazaejclbcdubusg.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoeWJqYXphZWpjbGJjZHVidXNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjM3MDMsImV4cCI6MjEwNDUzOTcwM30.DzJ27JbYzAE9EFacA2xYqEBEzQ9asqRyItPpk6FEGnA";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Unique identity for THIS browser tab (survives re-renders, distinct per tab).
        // Used for the cross-device "who is editing this job" presence/take-over feature.
        let TAB_ID = null;
        try {
            TAB_ID = sessionStorage.getItem('tcs_tab_id');
            if (!TAB_ID) {
                TAB_ID = 'tab_' + Math.random().toString(36).slice(2) + '_' + Date.now();
                sessionStorage.setItem('tcs_tab_id', TAB_ID);
            }
        } catch (e) { TAB_ID = 'tab_' + Math.random().toString(36).slice(2); }

        const POPULAR_BRANDS = ['Woodward', 'Siemens', 'Allen-Bradley', 'Yokogawa', 'Emerson', 'Bently Nevada', 'GE Fanuc', 'Schneider Electric', 'Honeywell', 'ABB'];
        const COUNTRY_CODES = { "Malaysia": "MY", "Singapore": "SG", "Indonesia": "ID", "United States": "US", "United Kingdom": "GB", "United Arab Emirates": "AE" };
        const SORTED_COUNTRY_LIST = Object.keys(COUNTRY_CODES).sort();
        const NORMALIZED_COUNTRY_CODES = Object.keys(COUNTRY_CODES).reduce((acc, key) => { acc[key.toLowerCase()] = COUNTRY_CODES[key]; return acc; }, {});

        const EMPTY_DIAG_SIDE = { visualInspection: '', probableCause: '', recommendedAction: '', notes: '', photos: [] };

        const WORKFLOW_STEPS = ['Draft', 'Diagnostic', 'Waiting PO', 'Proceed Repair', 'Repairing', 'Repair Completed', 'Repair Failed', 'QC', 'Delivery Arrangement', 'Delivered'];
        const NEXT_WORKFLOW_STEP = { 'Draft': 'Diagnostic', 'Waiting PO': 'Proceed Repair', 'Proceed Repair': 'Repairing', 'Repair Completed': 'QC', 'Repair Failed': 'QC', 'QC': 'Delivery Arrangement', 'Delivery Arrangement': 'Delivered', 'Delivered': null };

        const ROLE_PERMISSIONS = {
            superadmin: { canReceiveItem: true, canEditAdminPanel: true, canViewReport: true, canEditReport: true, canViewDiagnostic: true, canEditDiagnostic: true, canConsumeParts: true, canRequestParts: true, canManagePurchaseOrders: true, canSeeFullCustomerInfo: true, isDeliveryRole: false, canQC: true, canManageUsers: true, canTransferDepartment: true, allowedStatuses: WORKFLOW_STEPS },
            admin: { canReceiveItem: true, canEditAdminPanel: true, canViewReport: true, canEditReport: false, canViewDiagnostic: true, canEditDiagnostic: false, canConsumeParts: true, canRequestParts: true, canManagePurchaseOrders: true, canSeeFullCustomerInfo: true, isDeliveryRole: false, canQC: false, canManageUsers: false, canTransferDepartment: true, allowedStatuses: WORKFLOW_STEPS },
            engineer: { canReceiveItem: false, canEditAdminPanel: false, canViewReport: true, canEditReport: true, canViewDiagnostic: true, canEditDiagnostic: true, canConsumeParts: true, canRequestParts: true, canManagePurchaseOrders: false, canSeeFullCustomerInfo: false, isDeliveryRole: false, canQC: false, canManageUsers: false, canTransferDepartment: true, allowedStatuses: ['Diagnostic', 'Proceed Repair', 'Repairing', 'Repair Completed', 'Repair Failed', 'QC'] },
            mechanical: { canReceiveItem: false, canEditAdminPanel: false, canViewReport: true, canEditReport: true, canViewDiagnostic: false, canEditDiagnostic: false, canConsumeParts: true, canRequestParts: true, canManagePurchaseOrders: false, canSeeFullCustomerInfo: false, isDeliveryRole: false, canQC: false, canManageUsers: false, canTransferDepartment: true, allowedStatuses: ['Diagnostic', 'Proceed Repair', 'Repairing', 'Repair Completed', 'Repair Failed', 'QC'] },
            qc: { canReceiveItem: false, canEditAdminPanel: false, canViewReport: true, canEditReport: false, canViewDiagnostic: true, canEditDiagnostic: false, canConsumeParts: false, canRequestParts: false, canManagePurchaseOrders: false, canSeeFullCustomerInfo: false, isDeliveryRole: false, canQC: true, canManageUsers: false, canTransferDepartment: false, allowedStatuses: ['QC', 'Repairing', 'Delivery Arrangement'] },
            packaging: { canReceiveItem: false, canEditAdminPanel: false, canViewReport: false, canEditReport: false, canViewDiagnostic: false, canEditDiagnostic: false, canConsumeParts: false, canRequestParts: false, canManagePurchaseOrders: false, canSeeFullCustomerInfo: true, isDeliveryRole: true, canQC: false, canManageUsers: false, canTransferDepartment: false, allowedStatuses: ['Delivery Arrangement', 'Delivered'] },
            logistic: { canReceiveItem: false, canEditAdminPanel: false, canViewReport: false, canEditReport: false, canViewDiagnostic: false, canEditDiagnostic: false, canConsumeParts: false, canRequestParts: false, canManagePurchaseOrders: false, canSeeFullCustomerInfo: true, isDeliveryRole: true, canQC: false, canManageUsers: false, canTransferDepartment: false, allowedStatuses: ['Delivery Arrangement', 'Delivered'] },
            purchaser: { canReceiveItem: false, canEditAdminPanel: false, canViewReport: false, canEditReport: false, canViewDiagnostic: false, canEditDiagnostic: false, canConsumeParts: false, canRequestParts: false, canManagePurchaseOrders: true, canSeeFullCustomerInfo: false, isDeliveryRole: false, canQC: false, canManageUsers: false, canTransferDepartment: false, allowedStatuses: [] }
        };

        const ROLE_LABELS = {
            superadmin: 'System Superadmin (Full)',
            admin: 'Commercial Operations Admin',
            engineer: 'Technical Engineer Unit',
            mechanical: 'Mechanical Technician',
            qc: 'QC Inspector',
            packaging: 'Packaging & Shipping Unit',
            logistic: 'Logistic / Delivery Unit',
            purchaser: 'Purchaser'
        };

        // Permission keys a superadmin may revoke from an individual user account, on top of
        // whatever their base role normally allows. Only shown/applicable when the base role
        // grants that permission in the first place (a restriction can only take away, not add).
        const RESTRICTABLE_PERMS = [
            ['canEditAdminPanel', 'Edit commercial & admin details'],
            ['canEditDiagnostic', 'Edit diagnostic & repair reports'],
            ['canConsumeParts', 'Allocate parts / deduct inventory stock'],
            ['canRequestParts', 'Raise part requests / new parts'],
            ['canManagePurchaseOrders', 'Manage purchase requests & tracking'],
            ['canSeeFullCustomerInfo', 'View full customer contact info'],
            ['canQC', 'Perform QC sign-off'],
            ['canReceiveItem', 'Create new work orders'],
            ['canTransferDepartment', 'Transfer jobs between departments']
        ];

        const applyPermRestrictions = (basePerms, restrictions) => {
            if (!restrictions) return basePerms;
            const merged = { ...basePerms };
            Object.keys(restrictions).forEach(key => {
                if (restrictions[key] && typeof merged[key] === 'boolean') merged[key] = false;
            });
            return merged;
        };

        // Sends internal report text to the /api/polish-report serverless function, which
        // holds the Claude API key server-side and returns customer-facing rewrites of the
        // same fields. Throws on failure — callers decide whether to fall back to a raw copy.
        const polishReportFields = async (context, fields) => {
            const res = await fetch(POLISH_REPORT_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ context, fields }),
            });
            if (!res.ok) {
                let message = `Request failed (${res.status})`;
                try { const body = await res.json(); if (body && body.error) message = body.error; } catch (e) {}
                throw new Error(message);
            }
            const data = await res.json();
            return data.fields || {};
        };

        // Fill in your real facility details once here — every printable report pulls from this.
        const COMPANY_INFO = {
            name: 'TURBO CONTROL SOLUTIONS SDN BHD',
            tagline: 'Industrial Control Systems, Excitation & Turbine Repair Facility',
            regNo: '',
            address: '',
            phone: '',
            email: '',
            website: ''
        };

        const PrintLetterhead = ({ docTitle, refLabel, refValue, dateLabel, dateValue }) => {
            const contactLine = [COMPANY_INFO.address, COMPANY_INFO.phone, COMPANY_INFO.email, COMPANY_INFO.website].filter(Boolean).join('  •  ');
            return (
                <div className="print-only print-header hidden mb-8">
                    <div className="h-1.5 w-full bg-signal-600 mb-4 rounded-full"></div>
                    <div className="flex justify-between items-start border-b-2 border-slate-900 pb-6">
                        <div className="flex items-start gap-4">
                            <img src="image_c20be5.png" alt="TCS logo" className="w-14 h-14 object-contain shrink-0" />
                            <div>
                                <h1 className="text-2xl font-black tracking-tight text-slate-900 m-0 uppercase">{COMPANY_INFO.name}</h1>
                                <p className="text-xs font-semibold text-slate-600 mt-1">{COMPANY_INFO.tagline}</p>
                                {contactLine && <p className="text-[10px] text-slate-500 mt-1.5">{contactLine}</p>}
                                {COMPANY_INFO.regNo && <p className="text-[10px] text-slate-500 mt-0.5">Company Reg. No.: {COMPANY_INFO.regNo}</p>}
                            </div>
                        </div>
                        <div className="text-right text-xs">
                            <p className="font-bold text-slate-900">{refLabel}: {refValue}</p>
                            <p className="text-slate-600 mt-0.5">{dateLabel}: {dateValue}</p>
                        </div>
                    </div>
                    <div className="bg-slate-100 py-2.5 text-center border-b border-slate-300 mt-4">
                        <h2 className="text-xs font-black tracking-widest uppercase text-slate-900 m-0">{docTitle}</h2>
                    </div>
                </div>
            );
        };

        const PrintFooter = ({ terms }) => (
            <div className="print-only hidden mt-10 pt-4 border-t border-slate-300">
                {terms && <p className="text-[9px] text-slate-500 leading-relaxed mb-3">{terms}</p>}
                <div className="flex justify-between text-[9px] text-slate-400">
                    <span>This document is confidential and issued for the addressee named above only.</span>
                    <span>Generated {new Date().toLocaleString()}</span>
                </div>
            </div>
        );

        const daysSince = (timestamp) => {
            if (!timestamp) return null;
            const then = new Date(timestamp).getTime();
            if (isNaN(then)) return null;
            return Math.floor((Date.now() - then) / (1000 * 60 * 60 * 24));
        };

        const getAgingBadge = (repair) => {
            if (repair.status === 'Delivered') return null;
            const history = repair.statusHistory || [];
            const lastEntry = history[history.length - 1];
            const days = daysSince(lastEntry ? lastEntry.timestamp : repair.dateReceived);
            if (days === null) return null;
            let cls = 'bg-emerald-100 text-emerald-700';
            if (days >= 7) cls = 'bg-red-100 text-red-700';
            else if (days >= 3) cls = 'bg-amber-100 text-amber-700';
            return { days, cls };
        };

        // A repair's status history determines whether it's on the "Repair Completed" or "Repair
        // Failed" branch; this picks the one applicable label so both the step slot count and any
        // index lookup stay linear (WORKFLOW_STEPS itself lists both as separate entries).
        const getDisplaySteps = (repair) => {
            const isFailedPath = repair.status === 'Repair Failed' || (repair.statusHistory || []).some(h => h.status === 'Repair Failed');
            return ['Draft', 'Diagnostic', 'Waiting PO', 'Proceed Repair', 'Repairing', isFailedPath ? 'Repair Failed' : 'Repair Completed', 'QC', 'Delivery Arrangement', 'Delivered'];
        };

        const getProgressPercent = (repair) => {
            const steps = getDisplaySteps(repair);
            const idx = steps.indexOf(repair.status);
            if (idx < 0) return 0;
            return Math.max(0, Math.min(100, Math.round((idx / (steps.length - 1)) * 100)));
        };

        const formatDateTime = (timestamp) => {
            if (!timestamp) return '—';
            const date = new Date(timestamp);
            if (isNaN(date.getTime())) return timestamp;
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            return `${day}/${month}/${date.getFullYear()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        };

        // Status badges render as a small LED-style indicator dot + label, echoing a control-panel readout.
        const getStatusBadge = (status) => {
            const styles = {
                'Draft': 'bg-slate-100 text-slate-700 border-slate-200', 'Diagnostic': 'bg-blue-50 text-blue-700 border-blue-200',
                'Waiting PO': 'bg-amber-50 text-amber-700 border-amber-200', 'Proceed Repair': 'bg-indigo-50 text-indigo-700 border-indigo-200',
                'Repairing': 'bg-cyan-50 text-cyan-700 border-cyan-200', 'Repair Completed': 'bg-emerald-50 text-emerald-700 border-emerald-200',
                'Repair Failed': 'bg-red-50 text-red-700 border-red-200', 'QC': 'bg-purple-50 text-purple-700 border-purple-200',
                'Delivery Arrangement': 'bg-orange-50 text-orange-700 border-orange-200', 'Delivered': 'bg-teal-50 text-teal-700 border-teal-200'
            };
            const dot = {
                'Draft': 'text-slate-400', 'Diagnostic': 'text-blue-500', 'Waiting PO': 'text-amber-500', 'Proceed Repair': 'text-indigo-500',
                'Repairing': 'text-cyan-500', 'Repair Completed': 'text-emerald-500', 'Repair Failed': 'text-red-500', 'QC': 'text-purple-500',
                'Delivery Arrangement': 'text-orange-500', 'Delivered': 'text-teal-500'
            };
            return `<span class="px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider border inline-flex items-center gap-1.5 ${styles[status] || styles['Draft']}"><span class="led-dot inline-block w-1.5 h-1.5 rounded-full ${dot[status] || dot['Draft']}"></span>${status}</span>`;
        };

        // Department badges distinguish Electronic vs Mechanical work in the same visual language as status badges.
        const getDepartmentBadge = (department) => {
            const isMech = department === 'Mechanical';
            return `<span class="px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider border inline-flex items-center gap-1.5 ${isMech ? 'bg-signal-50 text-signal-700 border-orange-200' : 'bg-circuit-50 text-circuit-700 border-cyan-200'}"><i class="fa-solid ${isMech ? 'fa-gear' : 'fa-bolt'} text-[10px]"></i>${department || 'Electronic'}</span>`;
        };

        const AUDIT_TYPE_META = {
            status: { icon: 'fa-route', color: 'bg-brand-500' },
            edit: { icon: 'fa-pen', color: 'bg-amber-500' },
            report: { icon: 'fa-file-medical', color: 'bg-purple-500' },
            parts: { icon: 'fa-boxes-stacked', color: 'bg-cyan-600' },
            lock: { icon: 'fa-lock', color: 'bg-red-500' },
            transfer: { icon: 'fa-right-left', color: 'bg-signal-600' }
        };

        const appendAuditEntry = (repair, entry) => ({
            ...repair,
            statusHistory: [...(repair.statusHistory || []), {
                timestamp: new Date().toISOString(),
                type: entry.type || 'status',
                status: entry.status,
                detail: entry.detail || '',
                by: entry.by,
                byName: entry.byName
            }]
        });

        const SearchableCustomerSelect = ({ customers, formData, setFormData, isNewCustomer, setIsNewCustomer }) => {
            const [searchTerm, setSearchTerm] = useState(formData.customerCompany || '');
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);
            const filteredCustomers = customers.filter(c => c.company.toLowerCase().includes(searchTerm.toLowerCase()) || c.name.toLowerCase().includes(searchTerm.toLowerCase()));

            useEffect(() => {
                const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsOpen(false); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            return (
                <div className="relative mb-6" ref={dropdownRef}>
                    <div className="flex justify-between items-center mb-2">
                        <label className="block text-xs font-bold text-brand-800 uppercase tracking-wider">Client Directory Search</label>
                        <button type="button" onClick={() => {
                                setIsNewCustomer(!isNewCustomer);
                                if(!isNewCustomer) { setSearchTerm(''); setFormData({ ...formData, customerCompany: '', customerName: '', customerPhone: '', customerEmail: '', customerStreet: '', customerPostcode: '', customerCity: '', customerState: '', customerCountry: 'Malaysia' }); }
                            }} className="text-xs bg-brand-100 text-brand-800 hover:bg-brand-200 px-3 py-1 rounded font-semibold transition">
                            {isNewCustomer ? "Use Directory Search" : "+ Add New Client manually"}
                        </button>
                    </div>
                    {!isNewCustomer ? (
                        <div className="relative">
                            <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                            <input type="text" placeholder="Type corporate name or personnel..." value={searchTerm} onFocus={() => setIsOpen(true)} onChange={(e) => { setSearchTerm(e.target.value); setIsOpen(true); setFormData({...formData, customerCompany: e.target.value}); }} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white pl-9 focus:ring-2 focus:ring-brand-500 outline-none" />
                            {isOpen && (
                                <ul className="absolute z-30 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-xl max-h-48 overflow-y-auto text-sm custom-scrollbar">
                                    {filteredCustomers.length === 0 ? <li className="p-3 text-slate-500 text-xs text-center italic">No records match. Click "+ Add New Client" above.</li> : filteredCustomers.map(c => (
                                        <li key={c.id} onClick={() => {
                                            setSearchTerm(c.company);
                                            setFormData({ ...formData, customerCompany: c.company, customerName: c.name, customerPhone: c.phone, customerEmail: c.email, customerStreet: c.street, customerPostcode: c.postcode, customerCity: c.city, customerState: c.state, customerCountry: c.country });
                                            setIsNewCustomer(false); setIsOpen(false);
                                        }} className="p-3 hover:bg-brand-50 cursor-pointer border-b border-slate-100 last:border-0 transition">
                                            <div className="font-bold text-slate-800">{c.company}</div>
                                            <div className="text-xs text-slate-500 mt-1"><i className="fa-regular fa-user mr-1"></i> {c.name} | {c.city}, {c.state}</div>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    ) : (
                        <div className="text-xs text-amber-800 bg-amber-50 p-3 rounded border border-amber-200 font-medium">
                            <i className="fa-solid fa-circle-info mr-2"></i> Entering details manually will create a new corporate profile upon saving.
                        </div>
                    )}
                </div>
            );
        };

        const SearchablePartSelect = ({ stock, value, onChange }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);

            const selectedItem = stock.find(s => String(s.id) === String(value));
            const displayValue = selectedItem ? `${selectedItem.id} | ${selectedItem.partNumber || selectedItem.type} (${selectedItem.brand}) - Stock: ${selectedItem.qty}${selectedItem.location ? ' - Loc: ' + selectedItem.location : ''}` : searchTerm;

            const filteredStock = stock.filter(s => {
                const term = searchTerm.toLowerCase();
                return (
                    String(s.id).toLowerCase().includes(term) ||
                    String(s.partNumber).toLowerCase().includes(term) ||
                    String(s.type).toLowerCase().includes(term) ||
                    String(s.brand).toLowerCase().includes(term) ||
                    String(s.location).toLowerCase().includes(term)
                );
            });

            useEffect(() => {
                const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsOpen(false); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            return (
                <div className="relative flex-1" ref={dropdownRef}>
                    <div className="relative">
                        <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                        <input
                            type="text"
                            placeholder="Search Part Number, ID, Brand, Location..."
                            value={isOpen ? searchTerm : displayValue}
                            onFocus={() => { setIsOpen(true); setSearchTerm(''); }}
                            onChange={(e) => { setSearchTerm(e.target.value); setIsOpen(true); }}
                            className="w-full border-none pl-9 pr-4 py-2 text-sm bg-transparent outline-none font-semibold text-slate-800"
                        />
                    </div>
                    {isOpen && (
                        <ul className="absolute z-40 left-0 right-0 mt-2 bg-white border border-slate-200 rounded-lg shadow-xl max-h-60 overflow-y-auto text-sm custom-scrollbar">
                            <li onClick={() => { onChange(''); setIsOpen(false); setSearchTerm(''); }} className="p-3 text-slate-400 hover:bg-slate-50 cursor-pointer italic text-xs border-b border-slate-100">
                                -- Clear Selection --
                            </li>
                            {filteredStock.length === 0 ? (
                                <li className="p-3 text-slate-500 text-xs text-center italic">No matching components found.</li>
                            ) : (
                                filteredStock.map(s => (
                                    <li key={s.id} onClick={() => { onChange(s.id); setIsOpen(false); setSearchTerm(''); }} className="p-3 hover:bg-brand-50 cursor-pointer border-b border-slate-100 last:border-0 transition flex justify-between items-center">
                                        <div>
                                            <div className="font-bold text-brand-800 font-mono text-xs">{s.id} {s.partNumber ? `• ${s.partNumber}` : ''}</div>
                                            <div className="text-xs text-slate-600 mt-0.5 font-medium">{s.type} {s.brand ? `(${s.brand})` : ''}</div>
                                            <div className="text-[11px] text-slate-500 mt-0.5"><i className="fa-solid fa-location-dot mr-1"></i>{s.location || 'No location set'}</div>
                                        </div>
                                        <div className="text-right">
                                            <span className={`text-xs font-black px-2 py-1 rounded ${s.qty <= 0 ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-700'}`}>Stock: {s.qty}</span>
                                        </div>
                                    </li>
                                ))
                            )}
                        </ul>
                    )}
                </div>
            );
        };

        const PURCHASE_PLATFORMS = ['Shopee', 'element14', 'DigiKey', 'RS Components', 'Local Supplier', 'Other'];
        const PURCHASE_REQUEST_STATUSES = ['Requested', 'Ordered', 'Shipped', 'Delivered', 'Cancelled'];
        const PURCHASE_STATUS_STYLE = {
            'Requested': 'bg-amber-50 text-amber-700 border-amber-200',
            'Ordered': 'bg-blue-50 text-blue-700 border-blue-200',
            'Shipped': 'bg-indigo-50 text-indigo-700 border-indigo-200',
            'Delivered': 'bg-emerald-50 text-emerald-700 border-emerald-200',
            'Cancelled': 'bg-slate-100 text-slate-500 border-slate-200'
        };

        // A "request" is stored as one row per line item (mirrors how Transaction Log already logs
        // one row per deducted part); everything sharing a Request ID moves through Ordered/Shipped/
        // Delivered together, so the UI groups the flat list back into one card per Request ID.
        const groupPartRequests = (partRequests) => {
            const byId = {};
            partRequests.forEach(pr => {
                if (!byId[pr.requestId]) byId[pr.requestId] = { ...pr, items: [] };
                byId[pr.requestId].items.push({ partId: pr.partId, partName: pr.partName, isNewPart: pr.isNewPart, qty: pr.qty, purchaseLink: pr.purchaseLink, photoUrl: pr.photoUrl });
            });
            return Object.values(byId).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        };

        const emptyPartRequestItem = (partId) => ({ mode: 'existing', partId: partId || '', qty: 1, type: '', brand: '', partNumber: '', packageType: '', size: '', description: '', location: '', purchaseLink: '', photo: '', photoName: '' });

        const PartRequestModal = ({ stock, jobId, initialPartId, onSubmit, onClose }) => {
            const [items, setItems] = useState([emptyPartRequestItem(initialPartId)]);
            const [notes, setNotes] = useState('');

            const updateItem = (idx, patch) => setItems(items.map((it, i) => i === idx ? { ...it, ...patch } : it));

            const handlePhotoChange = (idx, file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => updateItem(idx, { photo: ev.target.result, photoName: file.name });
                reader.readAsDataURL(file);
            };

            const canSubmit = items.every(it => (it.mode === 'existing' ? it.partId : (it.type || it.partNumber)) && Number(it.qty) > 0);

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
                        <div className="p-6 border-b border-slate-200 flex justify-between items-center sticky top-0 bg-white z-10">
                            <h3 className="text-lg font-bold text-slate-800"><i className="fa-solid fa-boxes-packing text-amber-600 mr-2"></i> Request Part{jobId ? ` — ${jobId}` : ' (General Restock)'}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-700"><i className="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <div className="p-6 space-y-4">
                            {items.map((item, idx) => (
                                <div key={idx} className="border border-slate-200 rounded-lg p-4 bg-slate-50 space-y-3">
                                    <div className="flex justify-between items-center">
                                        <div className="flex gap-2 flex-wrap">
                                            <button type="button" onClick={() => updateItem(idx, { mode: 'existing' })} className={`px-3 py-1 rounded text-xs font-bold border transition ${item.mode === 'existing' ? 'bg-brand-800 text-white border-brand-800' : 'bg-white text-slate-600 border-slate-300'}`}>Existing Part</button>
                                            <button type="button" onClick={() => updateItem(idx, { mode: 'new' })} className={`px-3 py-1 rounded text-xs font-bold border transition ${item.mode === 'new' ? 'bg-amber-600 text-white border-amber-600' : 'bg-white text-slate-600 border-slate-300'}`}>New Part</button>
                                        </div>
                                        {items.length > 1 && <button type="button" onClick={() => setItems(items.filter((_, i) => i !== idx))} className="text-red-500 hover:text-red-700 text-xs"><i className="fa-solid fa-trash"></i></button>}
                                    </div>
                                    {item.mode === 'existing' ? (
                                        <div className="flex gap-3 items-center bg-white p-2 border border-slate-200 rounded">
                                            <SearchablePartSelect stock={stock} value={item.partId} onChange={(id) => updateItem(idx, { partId: id })} />
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                            <input placeholder="Type" value={item.type} onChange={e => updateItem(idx, { type: e.target.value })} className="border border-slate-300 rounded p-2 text-sm" />
                                            <input placeholder="Brand" value={item.brand} onChange={e => updateItem(idx, { brand: e.target.value })} className="border border-slate-300 rounded p-2 text-sm" />
                                            <input placeholder="Part Number" value={item.partNumber} onChange={e => updateItem(idx, { partNumber: e.target.value })} className="border border-slate-300 rounded p-2 text-sm" />
                                            <input placeholder="Package Type" value={item.packageType} onChange={e => updateItem(idx, { packageType: e.target.value })} className="border border-slate-300 rounded p-2 text-sm" />
                                            <input placeholder="Size" value={item.size} onChange={e => updateItem(idx, { size: e.target.value })} className="border border-slate-300 rounded p-2 text-sm" />
                                            <input placeholder="Storage Location" value={item.location} onChange={e => updateItem(idx, { location: e.target.value })} className="border border-slate-300 rounded p-2 text-sm" />
                                            <input placeholder="Description" value={item.description} onChange={e => updateItem(idx, { description: e.target.value })} className="border border-slate-300 rounded p-2 text-sm col-span-2" />
                                        </div>
                                    )}
                                    <div className="flex items-center gap-2">
                                        <label className="text-xs font-bold text-slate-600">Qty Needed</label>
                                        <input type="number" min="1" value={item.qty} onChange={e => updateItem(idx, { qty: e.target.value })} className="w-24 border border-slate-300 rounded p-2 text-sm text-center" />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2 border-t border-slate-200">
                                        <div>
                                            <label className="block text-[11px] font-bold text-slate-600 mb-1">Link to Purchase (optional)</label>
                                            <input placeholder="https://shopee.com.my/... or https://www.digikey.com/..." value={item.purchaseLink} onChange={e => updateItem(idx, { purchaseLink: e.target.value })} className="w-full border border-slate-300 rounded p-2 text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-bold text-slate-600 mb-1">Component Photo (optional)</label>
                                            <div className="flex items-center gap-2">
                                                <label className="bg-white border border-slate-300 hover:border-brand-500 text-slate-700 px-3 py-2 rounded text-xs font-bold cursor-pointer transition">
                                                    <i className="fa-solid fa-camera mr-1.5"></i> {item.photoName ? 'Change' : 'Upload'}
                                                    <input type="file" accept="image/*" className="hidden" onChange={e => handlePhotoChange(idx, e.target.files[0])} />
                                                </label>
                                                {item.photo && <img src={item.photo} alt="Component" className="w-10 h-10 object-cover rounded border border-slate-200" />}
                                                {item.photoName && <span className="text-[11px] text-slate-500 truncate max-w-[100px]">{item.photoName}</span>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                            <button type="button" onClick={() => setItems([...items, emptyPartRequestItem()])} className="text-xs font-bold text-brand-700 hover:underline flex items-center"><i className="fa-solid fa-plus mr-1"></i> Add Another Item</button>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Notes</label>
                                <textarea value={notes} onChange={e => setNotes(e.target.value)} rows="2" placeholder="Any context the purchaser should know..." className="w-full border border-slate-300 rounded p-2.5 text-sm"></textarea>
                            </div>
                        </div>
                        <div className="p-6 border-t border-slate-200 flex justify-end gap-3 sticky bottom-0 bg-white">
                            <button onClick={onClose} className="px-5 py-2.5 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100 transition">Cancel</button>
                            <button disabled={!canSubmit} onClick={() => onSubmit(items, notes)} className="bg-amber-600 hover:bg-amber-700 text-white px-6 py-2.5 rounded-lg text-sm font-bold transition shadow-md disabled:opacity-40 disabled:cursor-not-allowed">Send Request to Purchasing</button>
                        </div>
                    </div>
                </div>
            );
        };

        const PartRequestStatusModal = ({ group, canManage, onUpdate, onClose, repairs }) => {
            const [platform, setPlatform] = useState(group.platform || '');
            const [trackingNumber, setTrackingNumber] = useState(group.trackingNumber || '');
            const [trackingLink, setTrackingLink] = useState(group.trackingLink || '');
            const linkedJob = group.jobId ? repairs.find(r => r.id === group.jobId) : null;

            const setStatus = (status) => onUpdate(group.requestId, { status, platform, trackingNumber, trackingLink });

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto custom-scrollbar">
                        <div className="p-6 border-b border-slate-200 flex justify-between items-center">
                            <div>
                                <h3 className="text-lg font-bold text-slate-800 font-mono">{group.requestId}</h3>
                                <p className="text-xs text-slate-500 mt-1">Requested by {group.requestedBy} • {formatDateTime(group.timestamp)}</p>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-700"><i className="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <div className="p-6 space-y-4">
                            <div>
                                <div className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Items</div>
                                <div className="space-y-2">
                                    {group.items.map((it, i) => (
                                        <div key={i} className="flex justify-between items-center gap-3 bg-slate-50 border border-slate-200 rounded p-2.5 text-sm">
                                            <div className="flex items-center gap-2 min-w-0">
                                                {it.photoUrl && <img src={it.photoUrl} alt={it.partName} className="w-9 h-9 object-cover rounded border border-slate-200 shrink-0" />}
                                                <div className="min-w-0">
                                                    <span className="font-semibold text-slate-800">{it.partName} {it.isNewPart && <span className="ml-1 text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-bold uppercase align-middle">New</span>}</span>
                                                    {it.purchaseLink && <a href={it.purchaseLink} target="_blank" rel="noreferrer" className="block text-[11px] text-brand-700 font-bold hover:underline truncate"><i className="fa-solid fa-arrow-up-right-from-square mr-1"></i>Purchase link</a>}
                                                </div>
                                            </div>
                                            <span className="font-mono text-xs text-slate-500 shrink-0">x{it.qty}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="text-sm">
                                <span className="text-slate-500">Linked Job: </span>
                                <span className="font-bold text-slate-800">{group.jobId ? group.jobId : 'General Restock'}</span>
                                {linkedJob && <span className="text-xs text-slate-500 ml-2">({linkedJob.itemName})</span>}
                            </div>
                            {group.notes && <div className="text-sm bg-slate-50 border border-slate-200 rounded p-3 text-slate-700">{group.notes}</div>}

                            {canManage ? (
                                <div className="space-y-3 pt-3 border-t border-slate-100">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Platform</label>
                                            <select value={platform} onChange={e => setPlatform(e.target.value)} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white">
                                                <option value="">Select platform...</option>
                                                {PURCHASE_PLATFORMS.map(p => <option key={p} value={p}>{p}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Tracking Number</label>
                                            <input value={trackingNumber} onChange={e => setTrackingNumber(e.target.value)} className="w-full border border-slate-300 rounded p-2.5 text-sm" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Tracking Link</label>
                                        <input value={trackingLink} onChange={e => setTrackingLink(e.target.value)} placeholder="https://..." className="w-full border border-slate-300 rounded p-2.5 text-sm" />
                                    </div>
                                    <div className="flex flex-wrap gap-2 pt-2">
                                        {group.status !== 'Cancelled' && group.status !== 'Delivered' && PURCHASE_REQUEST_STATUSES.filter(s => s !== 'Cancelled' && s !== group.status).map(s => (
                                            <button key={s} onClick={() => setStatus(s)} className="bg-brand-800 hover:bg-brand-900 text-white px-4 py-2 rounded-lg text-xs font-bold transition shadow-sm">Mark {s}</button>
                                        ))}
                                        {group.status !== 'Delivered' && group.status !== 'Cancelled' && (
                                            <button onClick={() => setStatus('Cancelled')} className="bg-white border border-red-300 text-red-600 hover:bg-red-50 px-4 py-2 rounded-lg text-xs font-bold transition">Cancel Request</button>
                                        )}
                                    </div>
                                </div>
                            ) : (
                                <div className="pt-3 border-t border-slate-100 text-sm space-y-1">
                                    <div><span className="text-slate-500">Platform: </span><span className="font-bold text-slate-800">{group.platform || '—'}</span></div>
                                    <div><span className="text-slate-500">Tracking: </span>{group.trackingLink ? <a href={group.trackingLink} target="_blank" rel="noreferrer" className="text-brand-700 font-bold hover:underline">{group.trackingNumber || group.trackingLink} <i className="fa-solid fa-arrow-up-right-from-square text-[10px] ml-1"></i></a> : <span className="font-bold text-slate-800">{group.trackingNumber || '—'}</span>}</div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const PartRequests = ({ partRequests, stock, repairs, perms, currentUserName, onCreateRequest, onUpdateStatus }) => {
            const [statusFilter, setStatusFilter] = useState('All');
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [selectedGroup, setSelectedGroup] = useState(null);

            const groups = groupPartRequests(partRequests).filter(g => statusFilter === 'All' || g.status === statusFilter);

            return (
                <div className="space-y-6 fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800 tracking-tight">Part Requests</h2>
                            <p className="text-sm text-slate-500 mt-1">Engineering requests for parts to purchase, tracked through to delivery.</p>
                        </div>
                        <div className="flex gap-3 items-center">
                            <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="border border-slate-300 rounded-lg text-sm px-3 py-2 shadow-sm bg-white focus:ring-2 focus:ring-brand-500 outline-none">
                                <option value="All">All Statuses</option>
                                {PURCHASE_REQUEST_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                            {(perms.canRequestParts || perms.canManagePurchaseOrders) && (
                                <button onClick={() => setShowCreateModal(true)} className="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition shadow-md whitespace-nowrap">
                                    <i className="fa-solid fa-plus mr-2"></i> New Part Request
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase tracking-wider">
                                    <th className="p-4 font-bold">Request ID</th>
                                    <th className="p-4 font-bold">Items</th>
                                    <th className="p-4 font-bold">Job</th>
                                    <th className="p-4 font-bold">Requested By</th>
                                    <th className="p-4 font-bold">Status</th>
                                    <th className="p-4 font-bold">Platform</th>
                                    <th className="p-4 font-bold">Tracking</th>
                                    <th className="p-4 font-bold text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {groups.length === 0 ? (
                                    <tr><td colSpan={8} className="p-8 text-center text-slate-400 italic">No part requests match your filters.</td></tr>
                                ) : groups.map(g => (
                                    <tr key={g.requestId} className="hover:bg-slate-50 transition">
                                        <td className="p-4 font-mono text-xs font-bold text-brand-800">{g.requestId}</td>
                                        <td className="p-4 text-xs text-slate-700">
                                            {g.items.map((it, i) => (
                                                <div key={i}>{it.partName} <span className="text-slate-400">x{it.qty}</span> {it.isNewPart && <span className="ml-1 text-[9px] bg-amber-100 text-amber-700 px-1 py-0.5 rounded font-bold uppercase">New</span>}</div>
                                            ))}
                                        </td>
                                        <td className="p-4 text-xs font-semibold text-slate-600">{g.jobId || <span className="italic text-slate-400 font-normal">General Restock</span>}</td>
                                        <td className="p-4 text-xs font-semibold text-slate-600">{g.requestedBy}</td>
                                        <td className="p-4"><span className={`px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider border ${PURCHASE_STATUS_STYLE[g.status] || PURCHASE_STATUS_STYLE.Requested}`}>{g.status}</span></td>
                                        <td className="p-4 text-xs font-semibold text-slate-600">{g.platform || '—'}</td>
                                        <td className="p-4 text-xs">
                                            {g.trackingLink ? <a href={g.trackingLink} target="_blank" rel="noreferrer" className="text-brand-700 font-bold hover:underline"><i className="fa-solid fa-arrow-up-right-from-square mr-1"></i>Track</a> : (g.trackingNumber || <span className="text-slate-400">—</span>)}
                                        </td>
                                        <td className="p-4 text-right">
                                            <button onClick={() => setSelectedGroup(g)} className="bg-white border border-slate-300 hover:border-brand-500 hover:text-brand-700 text-slate-700 px-4 py-2 rounded text-xs font-bold transition shadow-sm">
                                                {perms.canManagePurchaseOrders ? 'Manage' : 'View'} <i className="fa-solid fa-arrow-right ml-1"></i>
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        </div>
                    </div>

                    {showCreateModal && (
                        <PartRequestModal
                            stock={stock}
                            jobId={null}
                            onClose={() => setShowCreateModal(false)}
                            onSubmit={(items, notes) => { onCreateRequest(null, items, notes); setShowCreateModal(false); }}
                        />
                    )}
                    {selectedGroup && (
                        <PartRequestStatusModal
                            group={selectedGroup}
                            canManage={perms.canManagePurchaseOrders}
                            repairs={repairs}
                            onUpdate={(requestId, updates) => { onUpdateStatus(requestId, updates); setSelectedGroup(null); }}
                            onClose={() => setSelectedGroup(null)}
                        />
                    )}
                </div>
            );
        };

        const ProgressBar = ({ percent, failed, thin }) => (
            <div className={`w-full bg-slate-200 rounded-full overflow-hidden ${thin ? 'h-1.5' : 'h-2'}`}>
                <div
                    className={`h-full rounded-full transition-all ${failed ? 'bg-red-500' : percent >= 100 ? 'bg-emerald-500' : 'bg-brand-600'}`}
                    style={{ width: `${percent}%` }}
                ></div>
            </div>
        );

        const Dashboard = ({ repairs, perms, userRole, currentUserName, onOpenRepair, navigateTo, viewersByJob, currentTabId, onRequestEdit }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('All');
            const [departmentFilter, setDepartmentFilter] = useState('All');
            const [myJobsOnly, setMyJobsOnly] = useState(false);
            const [pendingTransferOnly, setPendingTransferOnly] = useState(false);
            const [awaitingPartOnly, setAwaitingPartOnly] = useState(false);
            const [currentPage, setCurrentPage] = useState(1);
            const [collapsedGroups, setCollapsedGroups] = useState(() => new Set());

            const canFilterMine = userRole === 'engineer' || userRole === 'qc' || userRole === 'mechanical';

            let filtered = repairs.filter(r => r.id.includes(searchTerm) || r.customerCompany.toLowerCase().includes(searchTerm.toLowerCase()) || r.serial.toLowerCase().includes(searchTerm.toLowerCase()));
            if (statusFilter !== 'All') filtered = filtered.filter(r => r.status === statusFilter);
            if (departmentFilter !== 'All') filtered = filtered.filter(r => (r.department || 'Electronic') === departmentFilter);
            if (canFilterMine && myJobsOnly) filtered = filtered.filter(r => (r.assignedEngineer || '') === currentUserName);
            if (pendingTransferOnly) filtered = filtered.filter(r => r.pendingElectronicPickup);
            if (awaitingPartOnly) filtered = filtered.filter(r => r.awaitingPart);

            // Jobs sharing a non-blank client PO with at least one other job in the filtered set are
            // shown together under a collapsible group header; everything else renders as a normal row.
            const poGroups = {};
            filtered.forEach(r => {
                const po = (r.customerPo || '').trim();
                if (po) (poGroups[po] = poGroups[po] || []).push(r);
            });
            const groupedPOs = new Set(Object.keys(poGroups).filter(po => poGroups[po].length >= 2));
            const displayList = [];
            const seenGroups = new Set();
            filtered.forEach(r => {
                const po = (r.customerPo || '').trim();
                if (po && groupedPOs.has(po)) {
                    if (!seenGroups.has(po)) { seenGroups.add(po); displayList.push({ kind: 'group', po, items: poGroups[po] }); }
                } else {
                    displayList.push({ kind: 'single', repair: r });
                }
            });

            const itemsPerPage = 10;
            const totalPages = Math.ceil(displayList.length / itemsPerPage) || 1;
            const pageSafe = Math.min(currentPage, totalPages);
            const paginatedDisplay = displayList.slice((pageSafe - 1) * itemsPerPage, pageSafe * itemsPerPage);

            const toggleGroup = (po) => {
                setCollapsedGroups(prev => {
                    const next = new Set(prev);
                    if (next.has(po)) next.delete(po); else next.add(po);
                    return next;
                });
            };

            const pendingTransferCount = repairs.filter(r => r.pendingElectronicPickup).length;
            const awaitingPartCount = repairs.filter(r => r.awaitingPart).length;
            const colCount = perms.isDeliveryRole ? 8 : 9;

            const renderRepairRow = (repair, indented) => {
                const aging = getAgingBadge(repair);
                const pct = getProgressPercent(repair);
                const failed = repair.status === 'Repair Failed' || (repair.statusHistory || []).some(h => h.status === 'Repair Failed');
                return (
                    <tr key={repair.id} className={`hover:bg-slate-50 transition group ${repair.pendingElectronicPickup ? 'bg-signal-50/40' : ''} ${repair.awaitingPart ? 'bg-amber-50/40' : ''}`}>
                        <td className={`p-4 font-mono text-sm font-bold text-brand-800 ${indented ? 'pl-10' : ''}`}>
                            {repair.id}
                            {repair.warrantyType === 'W' && <span className="ml-2 text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-bold uppercase align-middle">Warranty</span>}
                            {repair.pendingElectronicPickup && <span className="ml-2 text-[10px] bg-signal-100 text-signal-700 px-1.5 py-0.5 rounded font-bold uppercase align-middle"><i className="fa-solid fa-right-left mr-1"></i>New Transfer</span>}
                            {repair.awaitingPart && <span className="ml-2 text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-bold uppercase align-middle"><i className="fa-solid fa-hourglass-half mr-1"></i>Waiting Part</span>}
                            {(() => {
                                const viewers = (viewersByJob && viewersByJob[repair.id]) || [];
                                if (!viewers.length) return null;
                                const holder = viewers[0];
                                const isMe = holder.tabId === currentTabId;
                                return (
                                    <div className="mt-1.5 flex items-center gap-2 flex-wrap font-sans normal-case">
                                        <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold uppercase ${isMe ? 'bg-emerald-100 text-emerald-700' : 'bg-cyan-100 text-cyan-700'}`}>
                                            <i className="fa-solid fa-eye mr-1"></i>{isMe ? 'Open by you' : `Open: ${holder.name} (${ROLE_LABELS[holder.role] || holder.role})`}
                                        </span>
                                        {!isMe && (
                                            <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); onRequestEdit(repair.id, holder.tabId, holder.name); }} className="text-[10px] font-bold text-brand-700 hover:underline">
                                                Request to edit
                                            </button>
                                        )}
                                    </div>
                                );
                            })()}
                        </td>
                        <td className="p-4" dangerouslySetInnerHTML={{ __html: getDepartmentBadge(repair.department) }}></td>
                        <td className="p-4">
                            <div className="font-bold text-slate-800">{repair.customerCompany}</div>
                            {perms.canSeeFullCustomerInfo && <div className="text-[11px] font-medium text-slate-500 mt-0.5"><i className="fa-regular fa-user mr-1"></i>{repair.customerName}</div>}
                        </td>
                        <td className="p-4">
                            <div className="font-semibold text-slate-800 text-sm">{repair.itemName}</div>
                            <div className="text-[11px] font-medium text-slate-500 mt-0.5">{repair.brand} {repair.model} | S/N: {repair.serial}</div>
                        </td>
                        {!perms.isDeliveryRole && (
                            <td className="p-4 text-xs font-semibold text-slate-600">{repair.assignedEngineer || <span className="italic text-slate-400 font-normal">Unassigned</span>}</td>
                        )}
                        <td className="p-4" dangerouslySetInnerHTML={{ __html: getStatusBadge(repair.status) }}></td>
                        <td className="p-4 w-32">
                            <ProgressBar percent={pct} failed={failed} thin />
                            <div className="text-[10px] font-bold text-slate-400 mt-1">{pct}%</div>
                        </td>
                        <td className="p-4">{aging && <span className={`px-2 py-1 rounded text-[11px] font-bold ${aging.cls}`}>{aging.days}d</span>}</td>
                        <td className="p-4 text-right">
                            <a href={`?job=${encodeURIComponent(repair.id)}`} onClick={(e) => { e.preventDefault(); onOpenRepair(repair); }} className="inline-block bg-white border border-slate-300 hover:border-brand-500 hover:text-brand-700 text-slate-700 px-4 py-2 rounded text-xs font-bold transition shadow-sm">
                                Manage <i className="fa-solid fa-arrow-right ml-1"></i>
                            </a>
                        </td>
                    </tr>
                );
            };

            const kpis = [
                { label: 'Total Active', count: repairs.length, icon: 'fa-list-check', color: 'text-blue-600', bg: 'bg-blue-50', border: 'border-l-blue-400', status: 'All' },
                { label: 'Pending Diagnostic', count: repairs.filter(r => r.status === 'Diagnostic').length, icon: 'fa-microscope', color: 'text-indigo-600', bg: 'bg-indigo-50', border: 'border-l-indigo-400', status: 'Diagnostic' },
                { label: 'Awaiting PO', count: repairs.filter(r => r.status === 'Waiting PO').length, icon: 'fa-file-invoice', color: 'text-amber-600', bg: 'bg-amber-50', border: 'border-l-amber-400', status: 'Waiting PO' },
                { label: 'In Repair', count: repairs.filter(r => r.status === 'Repairing').length, icon: 'fa-screwdriver-wrench', color: 'text-cyan-600', bg: 'bg-cyan-50', border: 'border-l-cyan-400', status: 'Repairing' },
                { label: 'Pending QC', count: repairs.filter(r => r.status === 'QC').length, icon: 'fa-clipboard-check', color: 'text-purple-600', bg: 'bg-purple-50', border: 'border-l-purple-400', status: 'QC' },
                { label: 'Ready for Delivery', count: repairs.filter(r => r.status === 'Delivery Arrangement').length, icon: 'fa-truck-fast', color: 'text-orange-600', bg: 'bg-orange-50', border: 'border-l-orange-400', status: 'Delivery Arrangement' }
            ];

            return (
                <div className="space-y-6 fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800 tracking-tight">Active Work Orders</h2>
                            <p className="text-sm text-slate-500 mt-1">Enterprise Service Management Overview</p>
                        </div>
                        <div className="flex gap-3 w-full md:w-auto flex-wrap">
                            <div className="relative flex-1 md:w-56">
                                <i className="fa-solid fa-search absolute left-3 top-3 text-slate-400"></i>
                                <input type="text" placeholder="Search ID, Serial, Company..." value={searchTerm} onChange={e => { setSearchTerm(e.target.value); setCurrentPage(1); }} className="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none shadow-sm" />
                            </div>
                            <select value={statusFilter} onChange={e => { setStatusFilter(e.target.value); setCurrentPage(1); }} className="border border-slate-300 rounded-lg text-sm px-3 py-2 shadow-sm bg-white focus:ring-2 focus:ring-brand-500 outline-none">
                                <option value="All">All Statuses</option>
                                {WORKFLOW_STEPS.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                            <select value={departmentFilter} onChange={e => { setDepartmentFilter(e.target.value); setCurrentPage(1); }} className="border border-slate-300 rounded-lg text-sm px-3 py-2 shadow-sm bg-white focus:ring-2 focus:ring-brand-500 outline-none">
                                <option value="All">All Departments</option>
                                <option value="Electronic">Electronic</option>
                                <option value="Mechanical">Mechanical</option>
                            </select>
                            {canFilterMine && (
                                <button onClick={() => { setMyJobsOnly(!myJobsOnly); setCurrentPage(1); }} className={`px-4 py-2 rounded-lg text-sm font-bold transition shadow-sm whitespace-nowrap border ${myJobsOnly ? 'bg-brand-800 text-white border-brand-800' : 'bg-white text-slate-700 border-slate-300 hover:border-brand-500'}`}>
                                    <i className="fa-solid fa-user-check mr-2"></i> My Jobs Only
                                </button>
                            )}
                            {perms.canReceiveItem && (
                                <button onClick={() => navigateTo('new-repair')} className="bg-brand-800 hover:bg-brand-900 text-white px-5 py-2 rounded-lg text-sm font-medium transition shadow-md whitespace-nowrap">
                                    <i className="fa-solid fa-plus mr-2"></i> New Order
                                </button>
                            )}
                        </div>
                    </div>

                    {pendingTransferCount > 0 && (
                        <button onClick={() => { setPendingTransferOnly(!pendingTransferOnly); setCurrentPage(1); }} className={`w-full flex items-center justify-between p-4 rounded-xl border-2 border-dashed transition text-left ${pendingTransferOnly ? 'border-signal-600 bg-signal-50' : 'border-signal-300 bg-signal-50/50 hover:bg-signal-50'}`}>
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-signal-100 text-signal-700 flex items-center justify-center text-base"><i className="fa-solid fa-right-left"></i></div>
                                <div>
                                    <p className="text-sm font-black text-signal-800">{pendingTransferCount} job{pendingTransferCount > 1 ? 's' : ''} handed over from Mechanical Department — awaiting Electronic pickup</p>
                                    <p className="text-xs text-signal-700 mt-0.5">Click to {pendingTransferOnly ? 'clear this filter' : 'show only these jobs'}</p>
                                </div>
                            </div>
                            <i className={`fa-solid fa-filter text-signal-600 ${pendingTransferOnly ? '' : 'opacity-40'}`}></i>
                        </button>
                    )}

                    {awaitingPartCount > 0 && (
                        <button onClick={() => { setAwaitingPartOnly(!awaitingPartOnly); setCurrentPage(1); }} className={`w-full flex items-center justify-between p-4 rounded-xl border-2 border-dashed transition text-left ${awaitingPartOnly ? 'border-amber-600 bg-amber-50' : 'border-amber-300 bg-amber-50/50 hover:bg-amber-50'}`}>
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center text-base"><i className="fa-solid fa-hourglass-half"></i></div>
                                <div>
                                    <p className="text-sm font-black text-amber-800">{awaitingPartCount} job{awaitingPartCount > 1 ? 's' : ''} paused, waiting on a part request</p>
                                    <p className="text-xs text-amber-700 mt-0.5">Click to {awaitingPartOnly ? 'clear this filter' : 'show only these jobs'}</p>
                                </div>
                            </div>
                            <i className={`fa-solid fa-filter text-amber-600 ${awaitingPartOnly ? '' : 'opacity-40'}`}></i>
                        </button>
                    )}

                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                        {kpis.map((kpi, i) => (
                            <button key={i} onClick={() => { setStatusFilter(kpi.status); setCurrentPage(1); }} className={`bg-white p-4 rounded-xl border border-l-4 shadow-sm flex items-center justify-between text-left transition hover:shadow-md ${kpi.border} ${statusFilter === kpi.status ? 'border-brand-500 ring-2 ring-brand-100' : 'border-slate-200'}`}>
                                <div><p className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">{kpi.label}</p><h4 className="text-xl font-mono font-black text-slate-800 mt-1">{String(kpi.count).padStart(2, '0')}</h4></div>
                                <div className={`w-10 h-10 rounded-full flex items-center justify-center ${kpi.bg} ${kpi.color} text-base`}><i className={`fa-solid ${kpi.icon}`}></i></div>
                            </button>
                        ))}
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase tracking-wider">
                                    <th className="p-4 font-bold">Job ID</th>
                                    <th className="p-4 font-bold">Dept</th>
                                    <th className="p-4 font-bold">{perms.isDeliveryRole ? 'Shipping Destination' : 'Client Organization'}</th>
                                    <th className="p-4 font-bold">Equipment Specs</th>
                                    {!perms.isDeliveryRole && <th className="p-4 font-bold">Assigned To</th>}
                                    <th className="p-4 font-bold">Status</th>
                                    <th className="p-4 font-bold">Progress</th>
                                    <th className="p-4 font-bold">Aging</th>
                                    <th className="p-4 font-bold text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {paginatedDisplay.length === 0 ? (
                                    <tr><td colSpan={colCount} className="p-8 text-center text-slate-400 italic">No work orders match your filters.</td></tr>
                                ) : paginatedDisplay.map(entry => {
                                    if (entry.kind === 'single') return renderRepairRow(entry.repair, false);

                                    const isCollapsed = collapsedGroups.has(entry.po);
                                    const groupAvg = Math.round(entry.items.reduce((sum, r) => sum + getProgressPercent(r), 0) / entry.items.length);
                                    return (
                                        <React.Fragment key={`po-${entry.po}`}>
                                            <tr className="bg-slate-100/70 border-y border-slate-200">
                                                <td colSpan={colCount} className="p-0">
                                                    <button onClick={() => toggleGroup(entry.po)} className="w-full flex items-center justify-between gap-4 px-4 py-3 text-left hover:bg-slate-200/40 transition">
                                                        <div className="flex items-center gap-3 min-w-0">
                                                            <i className={`fa-solid fa-chevron-right text-slate-400 transition-transform ${isCollapsed ? '' : 'rotate-90'}`}></i>
                                                            <i className="fa-solid fa-layer-group text-brand-600"></i>
                                                            <span className="font-mono text-xs font-black text-brand-800 bg-white border border-slate-300 rounded px-2 py-1">{entry.po}</span>
                                                            <span className="font-bold text-slate-800 text-sm truncate">{entry.items[0].customerCompany}</span>
                                                            <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap">{entry.items.length} items</span>
                                                        </div>
                                                        <div className="flex items-center gap-3 w-56 shrink-0">
                                                            <ProgressBar percent={groupAvg} thin />
                                                            <span className="text-[11px] font-black text-slate-600 w-10 text-right">{groupAvg}%</span>
                                                        </div>
                                                    </button>
                                                </td>
                                            </tr>
                                            {!isCollapsed && entry.items.map(r => renderRepairRow(r, true))}
                                        </React.Fragment>
                                    );
                                })}
                            </tbody>
                        </table>
                        </div>
                        {totalPages > 1 && (
                            <div className="flex justify-between items-center px-4 py-3 border-t border-slate-200">
                                <span className="text-xs text-slate-500 font-medium">Page <strong className="text-slate-800">{pageSafe}</strong> of <strong className="text-slate-800">{totalPages}</strong> ({filtered.length} jobs{displayList.length !== filtered.length ? `, ${displayList.length} rows` : ''})</span>
                                <div className="flex gap-2 flex-wrap">
                                    <button disabled={pageSafe === 1} onClick={() => setCurrentPage(pageSafe - 1)} className="px-3 py-1.5 border border-slate-300 rounded text-xs font-bold text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition"><i className="fa-solid fa-chevron-left mr-1"></i> Prev</button>
                                    <button disabled={pageSafe === totalPages} onClick={() => setCurrentPage(pageSafe + 1)} className="px-3 py-1.5 border border-slate-300 rounded text-xs font-bold text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition">Next <i className="fa-solid fa-chevron-right ml-1"></i></button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const NewRepairForm = ({ repairs, setRepairs, customers, setCustomers, navigateTo, setPreviewImage, userRole, currentUserName }) => {
                const [isNewCustomer, setIsNewCustomer] = useState(false);
                const todayStr = new Date().toISOString().split('T')[0];
                const [formData, setFormData] = useState({
                    dateReceived: todayStr, warrantyType: '', promisedDate: '', department: 'Electronic', customerCompany: '', customerName: '', customerPhone: '', customerEmail: '',
                    customerStreet: '', customerPostcode: '', customerCity: '', customerState: '', customerCountry: 'Malaysia',
                    customerPo: '', itemName: '', brand: '', model: '', serial: '', faultDescription: '',
                    photos: [], documents: []
                });

                const handlePhotoUpload = (e) => {
                    const files = Array.from(e.target.files);
                    files.forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (uploadEvent) => {
                            setFormData(prev => ({
                                ...prev,
                                photos: [...prev.photos, { url: uploadEvent.target.result, caption: file.name }]
                            }));
                        };
                        reader.readAsDataURL(file);
                    });
                    e.target.value = null;
                };
