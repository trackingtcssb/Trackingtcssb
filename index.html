                            <table className="w-full text-left text-sm border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 border-b-2 border-slate-200 text-xs uppercase tracking-widest text-slate-600 select-none">
                                        <th onClick={() => handleSort('id')} className="p-4 font-bold cursor-pointer hover:bg-slate-100 transition">
                                            SKU ID <i className={`fa-solid fa-sort ml-1 text-slate-400 ${sortConfig.key === 'id' ? 'text-brand-800 font-black' : ''}`}></i>
                                        </th>
                                        <th onClick={() => handleSort('type')} className="p-4 font-bold cursor-pointer hover:bg-slate-100 transition">
                                            Type <i className={`fa-solid fa-sort ml-1 text-slate-400 ${sortConfig.key === 'type' ? 'text-brand-800 font-black' : ''}`}></i>
                                        </th>
                                        <th onClick={() => handleSort('partNumber')} className="p-4 font-bold cursor-pointer hover:bg-slate-100 transition">
                                            Part Number <i className={`fa-solid fa-sort ml-1 text-slate-400 ${sortConfig.key === 'partNumber' ? 'text-brand-800 font-black' : ''}`}></i>
                                        </th>
                                        <th onClick={() => handleSort('location')} className="p-4 font-bold cursor-pointer hover:bg-slate-100 transition">
                                            Location <i className={`fa-solid fa-sort ml-1 text-slate-400 ${sortConfig.key === 'location' ? 'text-brand-800 font-black' : ''}`}></i>
                                        </th>
                                        <th onClick={() => handleSort('qty')} className="p-4 font-bold text-right cursor-pointer hover:bg-slate-100 transition">
                                            Available Qty <i className={`fa-solid fa-sort ml-1 text-slate-400 ${sortConfig.key === 'qty' ? 'text-brand-800 font-black' : ''}`}></i>
                                        </th>
                                        {(perms.canRequestParts || perms.canManagePurchaseOrders) && <th className="p-4 font-bold text-right">Actions</th>}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {paginatedItems.length === 0 ? (
                                        <tr>
                                            <td colSpan={(perms.canRequestParts || perms.canManagePurchaseOrders) ? 6 : 5} className="p-8 text-center text-slate-400 italic">No component records found matching your search.</td>
                                        </tr>
                                    ) : (
                                        paginatedItems.map(item => (
                                            <tr key={item.id} onClick={() => setSelectedItemDetail(item)} className={`border-b border-slate-100 hover:bg-brand-50/60 transition cursor-pointer group ${item.qty <= 0 ? 'bg-red-50/50' : item.qty <= 5 ? 'bg-amber-50/40' : ''}`}>
                                                <td className="p-4 font-mono font-bold text-brand-700 text-xs group-hover:underline">{item.id}</td>
                                                <td className="p-4 font-semibold text-slate-800">{item.type || '—'}</td>
                                                <td className="p-4 font-medium text-slate-700">{item.partNumber || '—'}</td>
                                                <td className="p-4 font-medium text-slate-600"><i className="fa-solid fa-location-dot text-slate-400 mr-1"></i>{item.location || '—'}</td>
                                                <td className="p-4 text-right font-black">
                                                    <span className={item.qty <= 0 ? 'text-red-700' : item.qty <= 5 ? 'text-amber-700' : 'text-slate-800'}>{item.qty}</span>
                                                    {item.qty <= 0 && <span className="ml-2 text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded font-bold uppercase align-middle">Out of stock</span>}
                                                    {item.qty > 0 && item.qty <= 5 && <span className="ml-2 text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-bold uppercase align-middle">Low</span>}
                                                </td>
                                                {(perms.canRequestParts || perms.canManagePurchaseOrders) && (
                                                    <td className="p-4 text-right">
                                                        <button onClick={(e) => { e.stopPropagation(); setRestockTarget(item); }} className="bg-white border border-slate-300 hover:border-amber-500 hover:text-amber-700 text-slate-700 px-3 py-1.5 rounded text-xs font-bold transition shadow-sm">
                                                            <i className="fa-solid fa-boxes-packing mr-1"></i> Request Restock
                                                        </button>
                                                    </td>
                                                )}
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>

                        {totalPages > 1 && (
                            <div className="flex justify-between items-center mt-6 pt-4 border-t border-slate-200">
                                <span className="text-xs text-slate-500 font-medium">
                                    Showing page <strong className="text-slate-800">{currentPage}</strong> of <strong className="text-slate-800">{totalPages}</strong> ({sorted.length} total components)
                                </span>
                                <div className="flex gap-2">
                                    <button
                                        disabled={currentPage === 1}
                                        onClick={() => setCurrentPage(currentPage - 1)}
                                        className="px-3 py-1.5 border border-slate-300 rounded text-xs font-bold text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition"
                                    >
                                        <i className="fa-solid fa-chevron-left mr-1"></i> Prev
                                    </button>
                                    <button
                                        disabled={currentPage === totalPages}
                                        onClick={() => setCurrentPage(currentPage + 1)}
                                        className="px-3 py-1.5 border border-slate-300 rounded text-xs font-bold text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition"
                                    >
                                        Next <i className="fa-solid fa-chevron-right ml-1"></i>
                                    </button>
                                </div>
                            </div>
                        )}

                        <ItemDetailModal item={selectedItemDetail} transactions={transactions} onClose={() => setSelectedItemDetail(null)} />
                        {restockTarget && (
                            <PartRequestModal
                                stock={stock}
                                jobId={null}
                                initialPartId={restockTarget.id}
                                onClose={() => setRestockTarget(null)}
                                onSubmit={(items, notes) => { onCreateRequest(null, items, notes); setRestockTarget(null); }}
                            />
                        )}
                    </div>
                );
        };

        const UserFormModal = ({ user, onSave, onClose }) => {
                const [form, setForm] = useState(user ? { ...user, restrictions: { ...(user.restrictions || {}) }, password: '' } : { id: '', name: '', email: '', role: 'engineer', status: 'Active', restrictions: {}, password: '' });
                const [saving, setSaving] = useState(false);
                const [error, setError] = useState('');
                const basePerms = ROLE_PERMISSIONS[form.role] || ROLE_PERMISSIONS.engineer;
                const applicableRestrictions = RESTRICTABLE_PERMS.filter(([key]) => basePerms[key] === true);

                const handleSubmit = async (e) => {
                    e.preventDefault();
                    setError('');
                    if (!form.name.trim()) { setError('Full name is required.'); return; }
                    if (!user) {
                        if (!form.email.trim()) { setError('Email is required to create a login.'); return; }
                        if (form.password.length < 8) { setError('Password must be at least 8 characters.'); return; }
                    }
                    setSaving(true);
                    try {
                        await onSave(form);
                    } catch (err) {
                        setError(err.message || 'Something went wrong.');
                    } finally {
                        setSaving(false);
                    }
                };

                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 fade-in" onClick={onClose}>
                        <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg max-h-[90vh] overflow-y-auto custom-scrollbar" onClick={e => e.stopPropagation()}>
                            <form onSubmit={handleSubmit} className="p-8 space-y-5">
                                <div className="flex justify-between items-center border-b border-slate-100 pb-4">
                                    <h3 className="text-lg font-bold text-slate-800">{user ? 'Edit User Account' : 'Create User Account'}</h3>
                                    <button type="button" onClick={onClose} className="text-slate-400 hover:text-slate-700"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <div><label className="block text-xs font-bold text-slate-700 mb-1">Full Name</label><input required type="text" value={form.name} onChange={e => setForm({...form, name: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm" /></div>
                                <div><label className="block text-xs font-bold text-slate-700 mb-1">Email {!user && <span className="font-normal text-slate-400 normal-case">(this becomes their login)</span>}</label><input required={!user} disabled={!!user} type="email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm disabled:bg-slate-50 disabled:text-slate-500" /></div>
                                {!user && (
                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Temporary Password</label><input required type="text" value={form.password} onChange={e => setForm({...form, password: e.target.value})} placeholder="At least 8 characters — share this with them securely" className="w-full border border-slate-300 rounded p-2.5 text-sm font-mono" /></div>
                                )}
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Role</label>
                                    <select value={form.role} onChange={e => setForm({...form, role: e.target.value, restrictions: {}})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white">
                                        {Object.entries(ROLE_LABELS).map(([value, label]) => <option key={value} value={value}>{label}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Account Status</label>
                                    <select value={form.status} onChange={e => setForm({...form, status: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white">
                                        <option value="Active">Active</option>
                                        <option value="Suspended">Suspended</option>
                                    </select>
                                </div>
                                {applicableRestrictions.length > 0 && (
                                    <div className="pt-3 border-t border-slate-100">
                                        <label className="block text-xs font-bold text-slate-700 mb-2">Additional Restrictions <span className="font-normal text-slate-400 normal-case">(revoke specific permissions this role would otherwise have)</span></label>
                                        <div className="space-y-2">
                                            {applicableRestrictions.map(([key, label]) => (
                                                <label key={key} className="flex items-center gap-2 text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded p-2.5 cursor-pointer">
                                                    <input type="checkbox" checked={!!form.restrictions[key]} onChange={e => setForm({...form, restrictions: { ...form.restrictions, [key]: e.target.checked }})} />
                                                    Restrict: {label}
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {error && <p className="text-xs font-bold text-red-600 bg-red-50 border border-red-200 rounded p-2.5">{error}</p>}
                                <div className="flex justify-end gap-3 pt-4 border-t border-slate-100">
                                    <button type="button" onClick={onClose} className="text-slate-600 font-semibold px-5 py-2.5 hover:bg-slate-100 rounded">Cancel</button>
                                    <button disabled={saving} type="submit" className="bg-brand-800 text-white px-6 py-2.5 rounded font-bold text-sm hover:bg-brand-900 shadow-md disabled:opacity-60">{saving ? 'Saving…' : (user ? 'Save Changes' : 'Create Account')}</button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
        };

        const UserManagement = ({ users, setUsers, currentUserName }) => {
                const [editingUser, setEditingUser] = useState(null);
                const [showForm, setShowForm] = useState(false);
                const [busyId, setBusyId] = useState(null);

                // Creating a login (and deleting one) needs Supabase's admin API, which requires
                // the service_role secret — that only runs server-side, in /api/admin-users.
                // Editing role/status/restrictions on an EXISTING account can go straight to the
                // database: Row Level Security already only allows a superadmin to do that.
                const callAdminUsersApi = async (payload) => {
                    const { data: { session } } = await supabase.auth.getSession();
                    const res = await fetch(ADMIN_USERS_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token || ''}` },
                        body: JSON.stringify(payload),
                    });
                    const body = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
                    return body;
                };

                const handleSave = async (form) => {
                    if (!editingUser) {
                        const { profile } = await callAdminUsersApi({
                            action: 'create', email: form.email, name: form.name, role: form.role,
                            status: form.status, restrictions: form.restrictions, password: form.password,
                        });
                        setUsers(prev => [...prev, profile]);
                    } else {
                        const { error } = await supabase.from('profiles')
                            .update({ name: form.name, role: form.role, status: form.status, restrictions: form.restrictions })
                            .eq('id', form.id);
                        if (error) throw new Error(error.message);
                        setUsers(prev => prev.map(u => u.id === form.id ? { ...u, name: form.name, role: form.role, status: form.status, restrictions: form.restrictions } : u));
                    }
                    setShowForm(false); setEditingUser(null);
                };

                const handleDelete = async (user) => {
                    if (!window.confirm(`Remove the login for ${user.name}? This cannot be undone.`)) return;
                    setBusyId(user.id);
                    try {
                        await callAdminUsersApi({ action: 'delete', id: user.id });
                        setUsers(prev => prev.filter(u => u.id !== user.id));
                    } catch (err) {
                        alert(`Couldn't delete this account: ${err.message}`);
                    } finally {
                        setBusyId(null);
                    }
                };

                const toggleStatus = async (user) => {
                    const nextStatus = user.status === 'Active' ? 'Suspended' : 'Active';
                    setBusyId(user.id);
                    const { error } = await supabase.from('profiles').update({ status: nextStatus }).eq('id', user.id);
                    setBusyId(null);
                    if (error) { alert(`Couldn't update status: ${error.message}`); return; }
                    setUsers(prev => prev.map(u => u.id === user.id ? { ...u, status: nextStatus } : u));
                };

                return (
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-8 fade-in max-w-5xl mx-auto">
                        <div className="flex justify-between items-center mb-8 border-b pb-4 flex-wrap gap-4">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800 tracking-tight">User & Access Management</h2>
                                <p className="text-sm text-slate-500 mt-1">Create real login accounts, assign roles, and restrict specific permissions. Superadmin only.</p>
                            </div>
                            <button onClick={() => { setEditingUser(null); setShowForm(true); }} className="bg-brand-800 hover:bg-brand-900 text-white px-5 py-2 rounded-lg text-sm font-bold transition shadow-md whitespace-nowrap">
                                <i className="fa-solid fa-user-plus mr-2"></i> New User
                            </button>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 border-b-2 border-slate-200 text-xs uppercase tracking-widest text-slate-600">
                                        <th className="p-4 font-bold">Name</th>
                                        <th className="p-4 font-bold">Email</th>
                                        <th className="p-4 font-bold">Role</th>
                                        <th className="p-4 font-bold">Restrictions</th>
                                        <th className="p-4 font-bold">Status</th>
                                        <th className="p-4 font-bold text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {users.length === 0 ? (
                                        <tr><td colSpan="6" className="p-8 text-center text-slate-400 italic">No user accounts yet.</td></tr>
                                    ) : users.map(user => {
                                        const restrictionCount = Object.values(user.restrictions || {}).filter(Boolean).length;
                                        return (
                                            <tr key={user.id} className="hover:bg-slate-50 transition">
                                                <td className="p-4 font-bold text-slate-800">{user.name}{user.name === currentUserName && <span className="ml-2 text-[10px] bg-brand-100 text-brand-700 px-1.5 py-0.5 rounded font-bold uppercase">You</span>}</td>
                                                <td className="p-4 text-slate-600">{user.email || '—'}</td>
                                                <td className="p-4"><span className="text-xs font-bold bg-slate-100 text-slate-700 px-2 py-1 rounded">{ROLE_LABELS[user.role] || user.role}</span></td>
                                                <td className="p-4 text-xs text-slate-500">{restrictionCount > 0 ? `${restrictionCount} restricted` : <span className="italic text-slate-400">None</span>}</td>
                                                <td className="p-4"><span className={`text-[11px] font-bold uppercase px-2 py-1 rounded ${user.status === 'Active' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}`}>{user.status}</span></td>
                                                <td className="p-4 text-right space-x-3 whitespace-nowrap">
                                                    <button disabled={busyId === user.id} onClick={() => { setEditingUser(user); setShowForm(true); }} className="text-xs font-bold text-slate-600 hover:underline disabled:opacity-40">Edit</button>
                                                    <button disabled={busyId === user.id} onClick={() => toggleStatus(user)} className="text-xs font-bold text-amber-600 hover:underline disabled:opacity-40">{user.status === 'Active' ? 'Suspend' : 'Activate'}</button>
                                                    <button disabled={busyId === user.id || user.name === currentUserName} onClick={() => handleDelete(user)} className="text-xs font-bold text-red-600 hover:underline disabled:opacity-40" title={user.name === currentUserName ? "You can't delete your own account" : ''}>Delete</button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>

                        {showForm && <UserFormModal user={editingUser} onSave={handleSave} onClose={() => { setShowForm(false); setEditingUser(null); }} />}
                    </div>
                );
        };

        const ActivityLog = ({ repairs }) => {
                const [filterType, setFilterType] = useState('All');
                const entries = repairs.flatMap(r => (r.statusHistory || []).map(h => ({ ...h, jobId: r.id, itemName: r.itemName, customerCompany: r.customerCompany })))
                    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                const filtered = filterType === 'All' ? entries : entries.filter(e => e.type === filterType);

                return (
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-8 fade-in max-w-5xl mx-auto">
                        <div className="flex justify-between items-center mb-8 border-b pb-4 flex-wrap gap-4">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800 tracking-tight">Global Activity Log</h2>
                                <p className="text-sm text-slate-500 mt-1">Every status change, report edit, and parts allocation across all work orders — superadmin visibility.</p>
                            </div>
                            <select value={filterType} onChange={e => setFilterType(e.target.value)} className="border border-slate-300 rounded-lg text-sm px-3 py-2 shadow-sm bg-white">
                                <option value="All">All Activity Types</option>
                                <option value="status">Status Changes</option>
                                <option value="edit">Edits</option>
                                <option value="report">Report Updates</option>
                                <option value="parts">Parts Allocation</option>
                                <option value="lock">Access / Lock Events</option>
                            </select>
                        </div>
                        <div className="space-y-3 max-h-[70vh] overflow-y-auto custom-scrollbar pr-2">
                            {filtered.length === 0 ? <p className="text-sm text-slate-400 italic text-center py-8">No activity recorded.</p> : filtered.map((e, i) => {
                                const meta = AUDIT_TYPE_META[e.type] || AUDIT_TYPE_META.status;
                                return (
                                    <div key={i} className="flex items-start gap-3 p-3 border border-slate-200 rounded-lg bg-slate-50">
                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center ${meta.color} text-white text-xs shrink-0 mt-0.5`}><i className={`fa-solid ${meta.icon}`}></i></div>
                                        <div className="flex-1 min-w-0">
                                            <div className="flex justify-between items-start gap-2">
                                                <p className="text-sm font-bold text-slate-800">{e.status}</p>
                                                <span className="text-[11px] text-slate-400 whitespace-nowrap">{formatDateTime(e.timestamp)}</span>
                                            </div>
                                            {e.detail && <p className="text-xs text-slate-600 mt-0.5">{e.detail}</p>}
                                            <p className="text-[11px] text-slate-500 mt-1">
                                                <span className="font-mono bg-white border border-slate-200 px-1.5 py-0.5 rounded">{e.jobId}</span>
                                                <span className="mx-1">•</span>{e.itemName} ({e.customerCompany})
                                                <span className="mx-1">•</span>{e.byName || e.by} <span className="uppercase text-brand-600 font-bold">({e.by})</span>
                                            </p>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
        };

        const AuthGateScreen = ({ icon, title, message, onLogout }) => (
            <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                <div className="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-slate-200 p-8 text-center">
                    <div className="w-14 h-14 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center text-2xl mx-auto mb-4"><i className={`fa-solid ${icon}`}></i></div>
                    <h2 className="text-base font-bold text-slate-800">{title}</h2>
                    <p className="text-sm text-slate-500 mt-2">{message}</p>
                    {onLogout && <button onClick={onLogout} className="mt-5 text-xs font-bold text-slate-500 hover:text-brand-700 hover:underline">Log out and try a different account</button>}
                </div>
            </div>
        );

        const LoginScreen = () => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const [resetSent, setResetSent] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(''); setResetSent(false); setLoading(true);
                const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
                setLoading(false);
                if (signInError) setError(signInError.message);
                // On success, App's onAuthStateChange listener picks up the new session automatically.
            };

            const handleForgotPassword = async () => {
                if (!email) { setError('Enter your email above first, then click "Forgot password".'); return; }
                setError(''); setLoading(true);
                const { error: resetError } = await supabase.auth.resetPasswordForEmail(email);
                setLoading(false);
                if (resetError) { setError(resetError.message); return; }
                setResetSent(true);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                    <div className="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
                        <div className="flex flex-col items-center mb-6">
                            <div className="w-14 h-14 rounded-lg bg-brand-900 flex items-center justify-center relative shrink-0 shadow-md mb-3">
                                <i className="fa-solid fa-gear text-white text-xl absolute -translate-x-1 -translate-y-0.5"></i>
                                <i className="fa-solid fa-bolt text-signal-500 text-sm absolute translate-x-2.5 translate-y-2.5"></i>
                            </div>
                            <h1 className="text-lg font-black text-brand-900 uppercase tracking-wide text-center">Turbo Control Solutions</h1>
                            <p className="text-xs text-slate-500 mt-1">Enterprise Service Management</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Email</label>
                                <input required type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full border border-slate-300 rounded p-2.5 text-sm" autoComplete="username" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Password</label>
                                <input required type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full border border-slate-300 rounded p-2.5 text-sm" autoComplete="current-password" />
                            </div>
                            {error && <p className="text-xs font-bold text-red-600 bg-red-50 border border-red-200 rounded p-2.5">{error}</p>}
                            {resetSent && <p className="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded p-2.5">Password reset email sent — check your inbox.</p>}
                            <button disabled={loading} type="submit" className="w-full bg-brand-800 hover:bg-brand-900 text-white py-2.5 rounded font-bold text-sm shadow-md disabled:opacity-60">
                                {loading ? 'Signing in…' : 'Sign In'}
                            </button>
                            <button type="button" onClick={handleForgotPassword} className="w-full text-xs font-bold text-slate-500 hover:text-brand-700 hover:underline">Forgot password?</button>
                        </form>
                    </div>
                </div>
            );
        };

        function App() {
            // --- Auth state -------------------------------------------------------
            // `session` starts `undefined` (haven't checked yet) so we can tell that
            // apart from `null` (checked, definitely logged out) and avoid flashing
            // the login screen for a moment on every page load.
            const [session, setSession] = useState(undefined);
            const [profile, setProfile] = useState(null);
            const [profileError, setProfileError] = useState('');

            useEffect(() => {
                supabase.auth.getSession().then(({ data }) => setSession(data.session));
                const { data: listener } = supabase.auth.onAuthStateChange((_event, newSession) => {
                    setSession(newSession);
                    if (!newSession) setProfile(null);
                });
                return () => listener.subscription.unsubscribe();
            }, []);

            useEffect(() => {
                if (!session) return;
                let cancelled = false;
                setProfileError('');
                supabase.from('profiles').select('*').eq('id', session.user.id).single().then(({ data, error }) => {
                    if (cancelled) return;
                    if (error || !data) {
                        setProfileError("Your login works, but no account profile is set up for you yet. Ask a superadmin to add you in Supabase (table 'profiles').");
                        return;
                    }
                    setProfile(data);
                });
                return () => { cancelled = true; };
            }, [session]);

            const handleLogout = () => { supabase.auth.signOut(); };

            const userRole = profile?.role || 'engineer';
            const currentUserName = profile?.name || session?.user?.email || '';
            const activeRestrictions = (profile?.restrictions && Object.keys(profile.restrictions).length) ? profile.restrictions : null;

            const [activeTab, setActiveTab] = useState('dashboard');
            const [repairs, setRepairsState] = useState([]);
            const [customers, setCustomersState] = useState([]);
            const [users, setUsers] = useState([]);
            const [dataLoading, setDataLoading] = useState(true);
            const [dataError, setDataError] = useState('');
            const [stock, setStock] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [partRequests, setPartRequests] = useState([]);
            const [loadingStock, setLoadingStock] = useState(true);
            const [stockError, setStockError] = useState(null);
            const [selectedRepair, setSelectedRepair] = useState(null);
            const [selectedItemDetail, setSelectedItemDetail] = useState(null);
            const [previewImage, setPreviewImage] = useState(null);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            const perms = applyPermRestrictions(ROLE_PERMISSIONS[userRole] || ROLE_PERMISSIONS.engineer, activeRestrictions);

            // --- Repairs / customers: load from Supabase once logged in, and persist
            // any change back automatically. Every existing handler throughout the app
            // already calls setRepairs(...)/setCustomers(...) the same way it always did
            // (either a new array, or a functional updater) — wrapping the setter here
            // means none of that business logic needed to change.
            useEffect(() => {
                if (!profile) return;
                let cancelled = false;
                setDataLoading(true);
                setDataError('');
                Promise.all([
                    supabase.from('repairs').select('id, data'),
                    supabase.from('customers').select('id, data'),
                    supabase.from('profiles').select('*'),
                ]).then(([repairsRes, customersRes, profilesRes]) => {
                    if (cancelled) return;
                    if (repairsRes.error || customersRes.error || profilesRes.error) {
                        setDataError('Failed to load work orders, customers, or user accounts from the database.');
                        setDataLoading(false);
                        return;
                    }
                    setRepairsState((repairsRes.data || []).map(row => ({ ...row.data, id: row.id })));
                    setCustomersState((customersRes.data || []).map(row => ({ ...row.data, id: row.id })));
                    setUsers(profilesRes.data || []);
                    setDataLoading(false);
                });
                return () => { cancelled = true; };
            }, [profile]);

            // Only rows whose object reference actually changed get upserted — every mutation
            // in this app builds its next array via `.map(r => r.id === id ? updated : r)` or
            // an array-spread prepend, both of which keep untouched rows' references intact.
            const diffChangedRows = (prevArr, nextArr) => {
                const prevById = new Map(prevArr.map(r => [r.id, r]));
                return nextArr.filter(r => prevById.get(r.id) !== r);
            };

            const persistRows = async (table, rows) => {
                if (!rows.length) return;
                const { error } = await supabase.from(table).upsert(rows.map(r => ({ id: r.id, data: r })));
                if (error) console.error(`Failed to save to ${table}:`, error);
            };

            const setRepairs = (update) => {
                setRepairsState(prev => {
                    const next = typeof update === 'function' ? update(prev) : update;
                    persistRows('repairs', diffChangedRows(prev, next));
                    return next;
                });
            };

            const setCustomers = (update) => {
                setCustomersState(prev => {
                    const next = typeof update === 'function' ? update(prev) : update;
                    persistRows('customers', diffChangedRows(prev, next));
                    return next;
                });
            };

            const loadData = () => {
                setLoadingStock(true);
                setStockError(null);
                fetch(GOOGLE_SHEET_API)
                    .then(res => res.json())
                    .then(data => {
                        const inventoryArray = data.inventory || data;
                        const txnArray = data.transactions || [];

                        setStock(inventoryArray.map(item => ({
                            id: item["Component ID"],
                            type: item["Type"] || '',
                            brand: item["Brand"] || '',
                            partNumber: item["Part Number"] || '',
                            packageType: item["Package Type"] || '',
                            size: item["Size"] || '',
                            description: item["Description"] || '',
                            location: item["Location"] || '',
                            initialStock: item["Initial Stock"] || 0,
                            qrCode: item["QR Code"] || '',
                            photo: "",
                            name: (item["Type"] || '') + (item["Brand"] ? " " + item["Brand"] : ""),
                            qty: item["Current Stock"] || 0
                        })));
                        setTransactions(txnArray);
                        setPartRequests((data.purchaseRequests || []).map(pr => ({
                            requestId: pr["Request ID"],
                            timestamp: pr["Timestamp"],
                            requestedBy: pr["Requested By"],
                            jobId: pr["Job ID"],
                            partId: pr["Part ID"],
                            partName: pr["Part Name"],
                            isNewPart: pr["New Part"] === "Yes" || pr["New Part"] === true,
                            qty: pr["Qty Requested"],
                            notes: pr["Notes"],
                            status: pr["Status"],
                            purchaser: pr["Purchaser"],
                            platform: pr["Platform"],
                            trackingNumber: pr["Tracking Number"],
                            trackingLink: pr["Tracking Link"],
                            purchaseLink: pr["Purchase Link"],
                            photoUrl: pr["Photo URL"],
                            lastUpdated: pr["Last Updated"]
                        })));
                        setLoadingStock(false);
                    }).catch(err => {
                        setLoadingStock(false);
                        setStockError("Failed to load live inventory from the warehouse database. Check your connection and try again.");
                    });
            };

            useEffect(() => {
                loadData();
            }, []);

            // Keep the currently-open repair's detail view in sync with the master `repairs` array.
            useEffect(() => {
                if (selectedRepair) {
                    const fresh = repairs.find(r => r.id === selectedRepair.id);
                    if (fresh && fresh !== selectedRepair) setSelectedRepair(fresh);
                }
            }, [repairs]);

            const navigateTo = (tab) => {
                setActiveTab(tab);
                if(tab !== 'detail') setSelectedRepair(null);
                if(tab !== 'item-detail') setSelectedItemDetail(null);
            };

            const onOpenRepair = (repair) => { setSelectedRepair(repair); setActiveTab('detail'); };

            const logAudit = (repairId, entry) => {
                setRepairs(prev => prev.map(r => r.id === repairId ? appendAuditEntry(r, entry) : r));
                setSelectedRepair(prev => (prev && prev.id === repairId) ? appendAuditEntry(prev, entry) : prev);
            };

            // New-part IDs are generated here (not by the backend) because the deductStock-style
            // fire-and-forget POST below runs with mode:'no-cors', so the response body can't be
            // read — the ID has to already be final before it's sent.
            const generateNextPartId = () => {
                const nums = stock.map(s => { const m = String(s.id).match(/PART-(\d+)/); return m ? parseInt(m[1], 10) : 0; });
                const next = (nums.length ? Math.max(...nums) : 0) + 1;
                return 'PART-' + String(next).padStart(4, '0');
            };

            const handleCreatePartRequest = (jobId, items, notes) => {
                const requestId = 'PR-' + Date.now().toString().slice(-8);
                const timestamp = new Date().toISOString();

                const finalItems = items.map(item => {
                    if (item.mode === 'new') {
                        const newId = generateNextPartId();
                        const name = (item.type || '') + (item.brand ? ' ' + item.brand : '');
                        setStock(prev => [...prev, { id: newId, type: item.type, brand: item.brand, partNumber: item.partNumber, packageType: item.packageType, size: item.size, description: item.description, location: item.location, initialStock: 0, qrCode: '', photo: '', name, qty: 0 }]);
                        fetch(GOOGLE_SHEET_API, {
                            method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'createPart', id: newId, type: item.type, brand: item.brand, partNumber: item.partNumber, packageType: item.packageType, size: item.size, description: item.description, location: item.location })
                        }).catch(err => console.error('createPart failed', err));
                        return { partId: newId, partName: name || item.partNumber, isNewPart: true, qty: Number(item.qty), purchaseLink: item.purchaseLink || '', photo: item.photo || '' };
                    }
                    const found = stock.find(s => String(s.id) === String(item.partId));
                    return { partId: item.partId, partName: found ? (found.name || found.partNumber) : item.partId, isNewPart: false, qty: Number(item.qty), purchaseLink: item.purchaseLink || '', photo: item.photo || '' };
                });

                const newRows = finalItems.map(it => ({
                    requestId, timestamp, requestedBy: currentUserName, jobId: jobId || '', partId: it.partId, partName: it.partName,
                    isNewPart: it.isNewPart, qty: it.qty, notes: notes || '', status: 'Requested', purchaser: '', platform: '', trackingNumber: '', trackingLink: '', lastUpdated: timestamp,
                    purchaseLink: it.purchaseLink, photoUrl: it.photo
                }));
                setPartRequests(prev => [...prev, ...newRows]);

                fetch(GOOGLE_SHEET_API, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'createPurchaseRequest', requestId, requestedBy: currentUserName, jobId: jobId || '', notes: notes || '', items: finalItems })
                }).catch(err => console.error('createPurchaseRequest failed', err));

                if (jobId) {
                    const detail = `Part request ${requestId} raised (${finalItems.length} item${finalItems.length > 1 ? 's' : ''}).`;
                    const addRequestId = (r) => appendAuditEntry({ ...r, awaitingPart: true, awaitingPartRequestIds: [...new Set([...(r.awaitingPartRequestIds || []), requestId])] }, { type: 'parts', status: 'Awaiting Part — Repair Paused', by: userRole, byName: currentUserName, detail });
                    setRepairs(prev => prev.map(r => r.id === jobId ? addRequestId(r) : r));
                    setSelectedRepair(prev => (prev && prev.id === jobId) ? addRequestId(prev) : prev);
                }
                setTimeout(loadData, 1500);
                alert(`Part request ${requestId} sent to Purchasing.`);
            };

            // A job can have several part requests open at once (item 2 of the update this shipped
            // in): only clear the paused/awaitingPart flag once every request it's still waiting on
            // has been resolved (delivered or cancelled), not just the one that just changed.
            const handleUpdatePartRequestStatus = (requestId, updates) => {
                const timestamp = new Date().toISOString();
                const group = partRequests.filter(pr => pr.requestId === requestId);
                const wasDelivered = group.some(pr => pr.status === 'Delivered');
                const isResolved = updates.status === 'Delivered' || updates.status === 'Cancelled';

                setPartRequests(prev => prev.map(pr => pr.requestId === requestId ? { ...pr, ...updates, purchaser: currentUserName, lastUpdated: timestamp } : pr));

                fetch(GOOGLE_SHEET_API, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'updatePurchaseRequestStatus', requestId, purchaser: currentUserName, ...updates })
                }).catch(err => console.error('updatePurchaseRequestStatus failed', err));

                if (updates.status === 'Delivered' && !wasDelivered) {
                    setStock(prev => prev.map(s => {
                        const match = group.find(g => String(g.partId) === String(s.id));
                        return match ? { ...s, qty: (Number(s.qty) || 0) + Number(match.qty) } : s;
                    }));
                }
                if (isResolved) {
                    const linkedJobIds = [...new Set(group.map(g => g.jobId).filter(Boolean))];
                    if (linkedJobIds.length) {
                        const detail = `Part request ${requestId} ${updates.status.toLowerCase()}.`;
                        const clearRequestId = (r) => {
                            const remaining = (r.awaitingPartRequestIds || []).filter(id => id !== requestId);
                            const resumed = remaining.length === 0;
                            return appendAuditEntry({ ...r, awaitingPart: !resumed, awaitingPartRequestIds: remaining }, { type: 'parts', status: resumed ? 'Part Delivered — Repair Resumed' : `Part Request ${updates.status} — Still Waiting on Others`, by: userRole, byName: currentUserName, detail });
                        };
                        setRepairs(prev => prev.map(r => (linkedJobIds.includes(r.id) && (r.awaitingPartRequestIds || []).includes(requestId)) ? clearRequestId(r) : r));
                        setSelectedRepair(prev => (prev && linkedJobIds.includes(prev.id) && (prev.awaitingPartRequestIds || []).includes(requestId)) ? clearRequestId(prev) : prev);
                    }
                }
                setTimeout(loadData, 1500);
            };


            const NavLinks = ({ onNavigate }) => (
                <React.Fragment>
                    <button onClick={() => onNavigate('dashboard')} className={`w-full flex items-center px-5 py-3.5 rounded-lg text-sm font-bold transition ${activeTab === 'dashboard' || activeTab === 'detail' || activeTab === 'new-repair' ? 'bg-brand-600 text-white shadow-lg' : 'hover:bg-brand-800 hover:text-white'}`}><i className="fa-solid fa-chart-line w-6 text-center mr-2"></i> Work Orders</button>
                    <button onClick={() => onNavigate('inventory')} className={`w-full flex items-center px-5 py-3.5 rounded-lg text-sm font-bold transition ${activeTab === 'inventory' ? 'bg-brand-600 text-white shadow-lg' : 'hover:bg-brand-800 hover:text-white'}`}><i className="fa-solid fa-server w-6 text-center mr-2"></i> Inventory Matrix</button>
                    {(perms.canRequestParts || perms.canManagePurchaseOrders) && (
                        <button onClick={() => onNavigate('part-requests')} className={`w-full flex items-center px-5 py-3.5 rounded-lg text-sm font-bold transition ${activeTab === 'part-requests' ? 'bg-brand-600 text-white shadow-lg' : 'hover:bg-brand-800 hover:text-white'}`}><i className="fa-solid fa-boxes-packing w-6 text-center mr-2"></i> Part Requests</button>
                    )}
                    {perms.canManageUsers && (
                        <React.Fragment>
                            <p className="text-[10px] font-black text-brand-500 uppercase tracking-widest mb-1 mt-5 ml-2">Superadmin Tools</p>
                            <button onClick={() => onNavigate('users')} className={`w-full flex items-center px-5 py-3.5 rounded-lg text-sm font-bold transition ${activeTab === 'users' ? 'bg-brand-600 text-white shadow-lg' : 'hover:bg-brand-800 hover:text-white'}`}><i className="fa-solid fa-users-gear w-6 text-center mr-2"></i> User Management</button>
                            <button onClick={() => onNavigate('activity')} className={`w-full flex items-center px-5 py-3.5 rounded-lg text-sm font-bold transition ${activeTab === 'activity' ? 'bg-brand-600 text-white shadow-lg' : 'hover:bg-brand-800 hover:text-white'}`}><i className="fa-solid fa-clock-rotate-left w-6 text-center mr-2"></i> Activity Log</button>
                        </React.Fragment>
                    )}
                </React.Fragment>
            );

            const IdentityControls = () => (
                <div>
                    <label className="block text-[10px] font-black text-brand-500 uppercase tracking-widest mb-2 flex items-center"><i className="fa-regular fa-id-badge mr-2"></i> Signed in as</label>
                    <div className="bg-brand-900 border border-brand-700 rounded p-2.5">
                        <p className="text-xs font-bold text-white truncate">{currentUserName}</p>
                        <p className="text-[10px] text-brand-400 mt-0.5">{ROLE_LABELS[userRole] || userRole}</p>
                    </div>
                    {activeRestrictions && <p className="text-[10px] text-amber-400 mt-1.5"><i className="fa-solid fa-lock mr-1"></i>Extra restrictions active on your account</p>}
                    <button onClick={handleLogout} className="w-full mt-2 text-xs font-bold text-slate-400 hover:text-white border border-brand-700 hover:border-brand-500 rounded py-2 transition"><i className="fa-solid fa-right-from-bracket mr-1.5"></i> Log Out</button>
                </div>
            );

            // --- Auth / data gating -------------------------------------------------
            // `session === undefined` means we haven't checked yet (avoids a login-screen
            // flash on every reload); `null` means definitely logged out.
            if (session === undefined) {
                return <AuthGateScreen icon="fa-spinner fa-spin" title="Loading" message="Checking your session…" />;
            }
            if (!session) {
                return <LoginScreen />;
            }
            if (profileError) {
                return <AuthGateScreen icon="fa-triangle-exclamation" title="Account not ready" message={profileError} onLogout={handleLogout} />;
            }
            if (!profile) {
                return <AuthGateScreen icon="fa-spinner fa-spin" title="Loading your account" message="One moment…" />;
            }
            if (profile.status === 'Suspended') {
                return <AuthGateScreen icon="fa-lock" title="Account suspended" message="Your account has been suspended. Contact a superadmin if you believe this is a mistake." onLogout={handleLogout} />;
            }
            if (dataLoading) {
                return <AuthGateScreen icon="fa-spinner fa-spin" title="Loading work orders" message="Fetching the latest jobs and customer records…" />;
            }
            if (dataError) {
                return <AuthGateScreen icon="fa-triangle-exclamation" title="Couldn't load data" message={dataError} onLogout={handleLogout} />;
            }

            return (
                <div className="min-h-screen flex text-slate-800 bg-slate-100">
                    <aside className="w-72 bg-brand-900 text-slate-300 hidden md:flex flex-col shadow-2xl z-20 no-print">

                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                                <div className="relative w-full max-w-6xl h-full flex items-center justify-center">
                                    <img src={previewImage} alt="Fullscreen Preview" className="max-w-full max-h-[90vh] object-contain shadow-2xl rounded-lg" onClick={(e) => e.stopPropagation()} />
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
