        const polishReportFields = async (context, fields) => {

                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ context, fields }),

                            <div>
                                <h1 className="text-2xl font-black tracking-tight text-slate-900 m-0 uppercase">{COMPANY_INFO.name}</h1>
                                <p className="text-xs font-semibold text-slate-600 mt-1">{COMPANY_INFO.tagline}</p>
                                {contactLine && <p className="text-[10px] text-slate-500 mt-1.5">{contactLine}</p>}

                            </div>

                        </div>
                    </div>
                    <div className="bg-slate-100 py-2.5 text-center border-b border-slate-300 mt-4">
                        <h2 className="text-xs font-black tracking-widest uppercase text-slate-900 m-0">{docTitle}</h2>
                    </div>
                </div>
            );
        };

        const PrintFooter = ({ terms }) => (
            <div className="print-only hidden mt-10 pt-4 border-t border-slate-300">
                {terms && <p className="text-[9px] text-slate-500 leading-relaxed mb-3">{terms}</p>}
                <div className="flex justify-between text-[9px] text-slate-400">
                    <span>This document is confidential and issued for the addressee named above only.</span>
                    <span>Generated {new Date().toLocaleString()}</span>
                </div>
            </div>
        );

        const daysSince = (timestamp) => {
            if (!timestamp) return null;
            const then = new Date(timestamp).getTime();
            if (isNaN(then)) return null;
            return Math.floor((Date.now() - then) / (1000 * 60 * 60 * 24));
        };

        const getAgingBadge = (repair) => {
            if (repair.status === 'Delivered') return null;
            const history = repair.statusHistory || [];
            const lastEntry = history[history.length - 1];
            const days = daysSince(lastEntry ? lastEntry.timestamp : repair.dateReceived);
            if (days === null) return null;
            let cls = 'bg-emerald-100 text-emerald-700';
            if (days >= 7) cls = 'bg-red-100 text-red-700';
            else if (days >= 3) cls = 'bg-amber-100 text-amber-700';
            return { days, cls };
        };

        // A repair's status history determines whether it's on the "Repair Completed" or "Repair
        // Failed" branch; this picks the one applicable label so both the step slot count and any
        // index lookup stay linear (WORKFLOW_STEPS itself lists both as separate entries).
        const getDisplaySteps = (repair) => {
            const isFailedPath = repair.status === 'Repair Failed' || (repair.statusHistory || []).some(h => h.status === 'Repair Failed');
            return ['Draft', 'Diagnostic', 'Waiting PO', 'Proceed Repair', 'Repairing', isFailedPath ? 'Repair Failed' : 'Repair Completed', 'QC', 'Delivery Arrangement', 'Delivered'];
        };

        const getProgressPercent = (repair) => {
            const steps = getDisplaySteps(repair);
            const idx = steps.indexOf(repair.status);
            if (idx < 0) return 0;
            return Math.max(0, Math.min(100, Math.round((idx / (steps.length - 1)) * 100)));
        };

        const formatDateTime = (timestamp) => {
            if (!timestamp) return '—';
            const date = new Date(timestamp);
            if (isNaN(date.getTime())) return timestamp;
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            return `${day}/${month}/${date.getFullYear()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        };

        // Status badges render as a small LED-style indicator dot + label, echoing a control-panel readout.
        const getStatusBadge = (status) => {
            const styles = {
                'Draft': 'bg-slate-100 text-slate-700 border-slate-200', 'Diagnostic': 'bg-blue-50 text-blue-700 border-blue-200',
                'Waiting PO': 'bg-amber-50 text-amber-700 border-amber-200', 'Proceed Repair': 'bg-indigo-50 text-indigo-700 border-indigo-200',
                'Repairing': 'bg-cyan-50 text-cyan-700 border-cyan-200', 'Repair Completed': 'bg-emerald-50 text-emerald-700 border-emerald-200',
                'Repair Failed': 'bg-red-50 text-red-700 border-red-200', 'QC': 'bg-purple-50 text-purple-700 border-purple-200',
                'Delivery Arrangement': 'bg-orange-50 text-orange-700 border-orange-200', 'Delivered': 'bg-teal-50 text-teal-700 border-teal-200'
            };
            const dot = {
                'Draft': 'text-slate-400', 'Diagnostic': 'text-blue-500', 'Waiting PO': 'text-amber-500', 'Proceed Repair': 'text-indigo-500',
                'Repairing': 'text-cyan-500', 'Repair Completed': 'text-emerald-500', 'Repair Failed': 'text-red-500', 'QC': 'text-purple-500',
                'Delivery Arrangement': 'text-orange-500', 'Delivered': 'text-teal-500'
            };
            return `<span class="px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider border inline-flex items-center gap-1.5 ${styles[status] || styles['Draft']}"><span class="led-dot inline-block w-1.5 h-1.5 rounded-full ${dot[status] || dot['Draft']}"></span>${status}</span>`;
        };

        // Department badges distinguish Electronic vs Mechanical work in the same visual language as status badges.
        const getDepartmentBadge = (department) => {
            const isMech = department === 'Mechanical';
            return `<span class="px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider border inline-flex items-center gap-1.5 ${isMech ? 'bg-signal-50 text-signal-700 border-orange-200' : 'bg-circuit-50 text-circuit-700 border-cyan-200'}"><i class="fa-solid ${isMech ? 'fa-gear' : 'fa-bolt'} text-[10px]"></i>${department || 'Electronic'}</span>`;
        };

        const AUDIT_TYPE_META = {
            status: { icon: 'fa-route', color: 'bg-brand-500' },
            edit: { icon: 'fa-pen', color: 'bg-amber-500' },
            report: { icon: 'fa-file-medical', color: 'bg-purple-500' },
            parts: { icon: 'fa-boxes-stacked', color: 'bg-cyan-600' },
            lock: { icon: 'fa-lock', color: 'bg-red-500' },
            transfer: { icon: 'fa-right-left', color: 'bg-signal-600' }
        };

        const appendAuditEntry = (repair, entry) => ({
            ...repair,
            statusHistory: [...(repair.statusHistory || []), {
                timestamp: new Date().toISOString(),
                type: entry.type || 'status',
                status: entry.status,
                detail: entry.detail || '',
                by: entry.by,
                byName: entry.byName
            }]
        });

        const SearchableCustomerSelect = ({ customers, formData, setFormData, isNewCustomer, setIsNewCustomer }) => {
            const [searchTerm, setSearchTerm] = useState(formData.customerCompany || '');
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);
            const filteredCustomers = customers.filter(c => c.company.toLowerCase().includes(searchTerm.toLowerCase()) || c.name.toLowerCase().includes(searchTerm.toLowerCase()));

            useEffect(() => {
                const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsOpen(false); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            return (
                <div className="relative mb-6" ref={dropdownRef}>
                    <div className="flex justify-between items-center mb-2">
                        <label className="block text-xs font-bold text-brand-800 uppercase tracking-wider">Client Directory Search</label>
                        <button type="button" onClick={() => {
                                setIsNewCustomer(!isNewCustomer);
                                if(!isNewCustomer) { setSearchTerm(''); setFormData({ ...formData, customerCompany: '', customerName: '', customerPhone: '', customerEmail: '', customerStreet: '', customerPostcode: '', customerCity: '', customerState: '', customerCountry: 'Malaysia' }); }
                            }} className="text-xs bg-brand-100 text-brand-800 hover:bg-brand-200 px-3 py-1 rounded font-semibold transition">
                            {isNewCustomer ? "Use Directory Search" : "+ Add New Client manually"}
                        </button>
                    </div>
                    {!isNewCustomer ? (
                        <div className="relative">
                            <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                            <input type="text" placeholder="Type corporate name or personnel..." value={searchTerm} onFocus={() => setIsOpen(true)} onChange={(e) => { setSearchTerm(e.target.value); setIsOpen(true); setFormData({...formData, customerCompany: e.target.value}); }} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white pl-9 focus:ring-2 focus:ring-brand-500 outline-none" />
                            {isOpen && (
                                <ul className="absolute z-30 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-xl max-h-48 overflow-y-auto text-sm custom-scrollbar">
                                    {filteredCustomers.length === 0 ? <li className="p-3 text-slate-500 text-xs text-center italic">No records match. Click "+ Add New Client" above.</li> : filteredCustomers.map(c => (
                                        <li key={c.id} onClick={() => {
                                            setSearchTerm(c.company);
                                            setFormData({ ...formData, customerCompany: c.company, customerName: c.name, customerPhone: c.phone, customerEmail: c.email, customerStreet: c.street, customerPostcode: c.postcode, customerCity: c.city, customerState: c.state, customerCountry: c.country });
                                            setIsNewCustomer(false); setIsOpen(false);
                                        }} className="p-3 hover:bg-brand-50 cursor-pointer border-b border-slate-100 last:border-0 transition">
                                            <div className="font-bold text-slate-800">{c.company}</div>
                                            <div className="text-xs text-slate-500 mt-1"><i className="fa-regular fa-user mr-1"></i> {c.name} | {c.city}, {c.state}</div>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    ) : (
                        <div className="text-xs text-amber-800 bg-amber-50 p-3 rounded border border-amber-200 font-medium">
                            <i className="fa-solid fa-circle-info mr-2"></i> Entering details manually will create a new corporate profile upon saving.
                        </div>
                    )}
                </div>
            );
        };

        const SearchablePartSelect = ({ stock, value, onChange }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);

            const selectedItem = stock.find(s => String(s.id) === String(value));
            const displayValue = selectedItem ? `${selectedItem.id} | ${selectedItem.partNumber || selectedItem.type} (${selectedItem.brand}) - Stock: ${selectedItem.qty}${selectedItem.location ? ' - Loc: ' + selectedItem.location : ''}` : searchTerm;

            const filteredStock = stock.filter(s => {
                const term = searchTerm.toLowerCase();
                return (
                    String(s.id).toLowerCase().includes(term) ||
                    String(s.partNumber).toLowerCase().includes(term) ||
                    String(s.type).toLowerCase().includes(term) ||
                    String(s.brand).toLowerCase().includes(term) ||
                    String(s.location).toLowerCase().includes(term)
                );
            });

            useEffect(() => {
                const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsOpen(false); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            return (
                <div className="relative flex-1" ref={dropdownRef}>
                    <div className="relative">
                        <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                        <input
                            type="text"
                            placeholder="Search Part Number, ID, Brand, Location..."
                            value={isOpen ? searchTerm : displayValue}
                            onFocus={() => { setIsOpen(true); setSearchTerm(''); }}
                            onChange={(e) => { setSearchTerm(e.target.value); setIsOpen(true); }}
                            className="w-full border-none pl-9 pr-4 py-2 text-sm bg-transparent outline-none font-semibold text-slate-800"
                        />
                    </div>
                    {isOpen && (
                        <ul className="absolute z-40 left-0 right-0 mt-2 bg-white border border-slate-200 rounded-lg shadow-xl max-h-60 overflow-y-auto text-sm custom-scrollbar">
                            <li onClick={() => { onChange(''); setIsOpen(false); setSearchTerm(''); }} className="p-3 text-slate-400 hover:bg-slate-50 cursor-pointer italic text-xs border-b border-slate-100">
                                -- Clear Selection --
                            </li>
                            {filteredStock.length === 0 ? (
                                <li className="p-3 text-slate-500 text-xs text-center italic">No matching components found.</li>
                            ) : (
                                filteredStock.map(s => (
                                    <li key={s.id} onClick={() => { onChange(s.id); setIsOpen(false); setSearchTerm(''); }} className="p-3 hover:bg-brand-50 cursor-pointer border-b border-slate-100 last:border-0 transition flex justify-between items-center">
                                        <div>
                                            <div className="font-bold text-brand-800 font-mono text-xs">{s.id} {s.partNumber ? `• ${s.partNumber}` : ''}</div>
                                            <div className="text-xs text-slate-600 mt-0.5 font-medium">{s.type} {s.brand ? `(${s.brand})` : ''}</div>
                                            <div className="text-[11px] text-slate-500 mt-0.5"><i className="fa-solid fa-location-dot mr-1"></i>{s.location || 'No location set'}</div>
                                        </div>
                                        <div className="text-right">
                                            <span className={`text-xs font-black px-2 py-1 rounded ${s.qty <= 0 ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-700'}`}>Stock: {s.qty}</span>
                                        </div>
                                    </li>
                                ))
                            )}
                        </ul>
                    )}
                </div>
            );
        };

        const PURCHASE_PLATFORMS = ['Shopee', 'element14', 'DigiKey', 'RS Components', 'Local Supplier', 'Other'];
        const PURCHASE_REQUEST_STATUSES = ['Requested', 'Ordered', 'Shipped', 'Delivered', 'Cancelled'];
        const PURCHASE_STATUS_STYLE = {
            'Requested': 'bg-amber-50 text-amber-700 border-amber-200',
            'Ordered': 'bg-blue-50 text-blue-700 border-blue-200',
            'Shipped': 'bg-indigo-50 text-indigo-700 border-indigo-200',
            'Delivered': 'bg-emerald-50 text-emerald-700 border-emerald-200',
            'Cancelled': 'bg-slate-100 text-slate-500 border-slate-200'
        };

        // A "request" is stored as one row per line item (mirrors how Transaction Log already logs
        // one row per deducted part); everything sharing a Request ID moves through Ordered/Shipped/
        // Delivered together, so the UI groups the flat list back into one card per Request ID.
        const groupPartRequests = (partRequests) => {
            const byId = {};
            partRequests.forEach(pr => {
                if (!byId[pr.requestId]) byId[pr.requestId] = { ...pr, items: [] };
                byId[pr.requestId].items.push({ partId: pr.partId, partName: pr.partName, isNewPart: pr.isNewPart, qty: pr.qty, purchaseLink: pr.purchaseLink, photoUrl: pr.photoUrl });
            });
            return Object.values(byId).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        };

        const emptyPartRequestItem = (partId) => ({ mode: 'existing', partId: partId || '', qty: 1, type: '', brand: '', partNumber: '', packageType: '', size: '', description: '', location: '', purchaseLink: '', photo: '', photoName: '' });

        const PartRequestModal = ({ stock, jobId, initialPartId, onSubmit, onClose }) => {
            const [items, setItems] = useState([emptyPartRequestItem(initialPartId)]);
            const [notes, setNotes] = useState('');

            const updateItem = (idx, patch) => setItems(items.map((it, i) => i === idx ? { ...it, ...patch } : it));

            const handlePhotoChange = (idx, file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => updateItem(idx, { photo: ev.target.result, photoName: file.name });
                reader.readAsDataURL(file);
            };

            const canSubmit = items.every(it => (it.mode === 'existing' ? it.partId : (it.type || it.partNumber)) && Number(it.qty) > 0);

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
                        <div className="p-6 border-b border-slate-200 flex justify-between items-center sticky top-0 bg-white z-10">
                            <h3 className="text-lg font-bold text-slate-800"><i className="fa-solid fa-boxes-packing text-amber-600 mr-2"></i> Request Part{jobId ? ` — ${jobId}` : ' (General Restock)'}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-700"><i className="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <div className="p-6 space-y-4">
                            {items.map((item, idx) => (
                                <div key={idx} className="border border-slate-200 rounded-lg p-4 bg-slate-50 space-y-3">
                                    <div className="flex justify-between items-center">
                                        <div className="flex gap-2">
                                            <button type="button" onClick={() => updateItem(idx, { mode: 'existing' })} className={`px-3 py-1 rounded text-xs font-bold border transition ${item.mode === 'existing' ? 'bg-brand-800 text-white border-brand-800' : 'bg-white text-slate-600 border-slate-300'}`}>Existing Part</button>
                                            <button type="button" onClick={() => updateItem(idx, { mode: 'new' })} className={`px-3 py-1 rounded text-xs font-bold border transition ${item.mode === 'new' ? 'bg-amber-600 text-white border-amber-600' : 'bg-white text-slate-600 border-slate-300'}`}>New Part</button>
                                        </div>
                                        {items.length > 1 && <button type="button" onClick={() => setItems(items.filter((_, i) => i !== idx))} className="text-red-500 hover:text-red-700 text-xs"><i className="fa-solid fa-trash"></i></button>}
                                    </div>
                                    {item.mode === 'existing' ? (
                                        <div className="flex gap-3 items-center bg-white p-2 border border-slate-200 rounded">
                                            <SearchablePartSelect stock={stock} value={item.partId} onChange={(id) => updateItem(idx, { partId: id })} />
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-2">
                                            <input placeholder="Type" value={item.type} onChange={e => updateItem(idx, { type: e.target.value })} className="border border-slate-300 rounded p-2 text-sm" />
                                            <input placeholder="Brand" value={item.brand} onChange={e => updateItem(idx, { brand: e.target.value })} className="border border-slate-300 rounded p-2 text-sm" />
                                            <input placeholder="Part Number" value={item.partNumber} onChange={e => updateItem(idx, { partNumber: e.target.value })} className="border border-slate-300 rounded p-2 text-sm" />
                                            <input placeholder="Package Type" value={item.packageType} onChange={e => updateItem(idx, { packageType: e.target.value })} className="border border-slate-300 rounded p-2 text-sm" />
                                            <input placeholder="Size" value={item.size} onChange={e => updateItem(idx, { size: e.target.value })} className="border border-slate-300 rounded p-2 text-sm" />
                                            <input placeholder="Storage Location" value={item.location} onChange={e => updateItem(idx, { location: e.target.value })} className="border border-slate-300 rounded p-2 text-sm" />
                                            <input placeholder="Description" value={item.description} onChange={e => updateItem(idx, { description: e.target.value })} className="border border-slate-300 rounded p-2 text-sm col-span-2" />
                                        </div>
                                    )}
                                    <div className="flex items-center gap-2">
                                        <label className="text-xs font-bold text-slate-600">Qty Needed</label>
                                        <input type="number" min="1" value={item.qty} onChange={e => updateItem(idx, { qty: e.target.value })} className="w-24 border border-slate-300 rounded p-2 text-sm text-center" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200">
                                        <div>
                                            <label className="block text-[11px] font-bold text-slate-600 mb-1">Link to Purchase (optional)</label>
                                            <input placeholder="https://shopee.com.my/... or https://www.digikey.com/..." value={item.purchaseLink} onChange={e => updateItem(idx, { purchaseLink: e.target.value })} className="w-full border border-slate-300 rounded p-2 text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-bold text-slate-600 mb-1">Component Photo (optional)</label>
                                            <div className="flex items-center gap-2">
                                                <label className="bg-white border border-slate-300 hover:border-brand-500 text-slate-700 px-3 py-2 rounded text-xs font-bold cursor-pointer transition">
                                                    <i className="fa-solid fa-camera mr-1.5"></i> {item.photoName ? 'Change' : 'Upload'}
                                                    <input type="file" accept="image/*" className="hidden" onChange={e => handlePhotoChange(idx, e.target.files[0])} />
                                                </label>
                                                {item.photo && <img src={item.photo} alt="Component" className="w-10 h-10 object-cover rounded border border-slate-200" />}
                                                {item.photoName && <span className="text-[11px] text-slate-500 truncate max-w-[100px]">{item.photoName}</span>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                            <button type="button" onClick={() => setItems([...items, emptyPartRequestItem()])} className="text-xs font-bold text-brand-700 hover:underline flex items-center"><i className="fa-solid fa-plus mr-1"></i> Add Another Item</button>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Notes</label>
                                <textarea value={notes} onChange={e => setNotes(e.target.value)} rows="2" placeholder="Any context the purchaser should know..." className="w-full border border-slate-300 rounded p-2.5 text-sm"></textarea>
                            </div>
                        </div>
                        <div className="p-6 border-t border-slate-200 flex justify-end gap-3 sticky bottom-0 bg-white">
                            <button onClick={onClose} className="px-5 py-2.5 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100 transition">Cancel</button>
                            <button disabled={!canSubmit} onClick={() => onSubmit(items, notes)} className="bg-amber-600 hover:bg-amber-700 text-white px-6 py-2.5 rounded-lg text-sm font-bold transition shadow-md disabled:opacity-40 disabled:cursor-not-allowed">Send Request to Purchasing</button>
                        </div>
                    </div>
                </div>
            );
        };

        const PartRequestStatusModal = ({ group, canManage, onUpdate, onClose, repairs }) => {
            const [platform, setPlatform] = useState(group.platform || '');
            const [trackingNumber, setTrackingNumber] = useState(group.trackingNumber || '');
            const [trackingLink, setTrackingLink] = useState(group.trackingLink || '');
            const linkedJob = group.jobId ? repairs.find(r => r.id === group.jobId) : null;

            const setStatus = (status) => onUpdate(group.requestId, { status, platform, trackingNumber, trackingLink });

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto custom-scrollbar">
                        <div className="p-6 border-b border-slate-200 flex justify-between items-center">
                            <div>
                                <h3 className="text-lg font-bold text-slate-800 font-mono">{group.requestId}</h3>
                                <p className="text-xs text-slate-500 mt-1">Requested by {group.requestedBy} • {formatDateTime(group.timestamp)}</p>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-700"><i className="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <div className="p-6 space-y-4">
                            <div>
                                <div className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Items</div>
                                <div className="space-y-2">
                                    {group.items.map((it, i) => (
                                        <div key={i} className="flex justify-between items-center gap-3 bg-slate-50 border border-slate-200 rounded p-2.5 text-sm">
                                            <div className="flex items-center gap-2 min-w-0">
                                                {it.photoUrl && <img src={it.photoUrl} alt={it.partName} className="w-9 h-9 object-cover rounded border border-slate-200 shrink-0" />}
                                                <div className="min-w-0">
                                                    <span className="font-semibold text-slate-800">{it.partName} {it.isNewPart && <span className="ml-1 text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-bold uppercase align-middle">New</span>}</span>
                                                    {it.purchaseLink && <a href={it.purchaseLink} target="_blank" rel="noreferrer" className="block text-[11px] text-brand-700 font-bold hover:underline truncate"><i className="fa-solid fa-arrow-up-right-from-square mr-1"></i>Purchase link</a>}
                                                </div>
                                            </div>
                                            <span className="font-mono text-xs text-slate-500 shrink-0">x{it.qty}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="text-sm">
                                <span className="text-slate-500">Linked Job: </span>
                                <span className="font-bold text-slate-800">{group.jobId ? group.jobId : 'General Restock'}</span>
                                {linkedJob && <span className="text-xs text-slate-500 ml-2">({linkedJob.itemName})</span>}
                            </div>
                            {group.notes && <div className="text-sm bg-slate-50 border border-slate-200 rounded p-3 text-slate-700">{group.notes}</div>}

                            {canManage ? (
                                <div className="space-y-3 pt-3 border-t border-slate-100">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Platform</label>
                                            <select value={platform} onChange={e => setPlatform(e.target.value)} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white">
                                                <option value="">Select platform...</option>
                                                {PURCHASE_PLATFORMS.map(p => <option key={p} value={p}>{p}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Tracking Number</label>
                                            <input value={trackingNumber} onChange={e => setTrackingNumber(e.target.value)} className="w-full border border-slate-300 rounded p-2.5 text-sm" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Tracking Link</label>
                                        <input value={trackingLink} onChange={e => setTrackingLink(e.target.value)} placeholder="https://..." className="w-full border border-slate-300 rounded p-2.5 text-sm" />
                                    </div>
                                    <div className="flex flex-wrap gap-2 pt-2">
                                        {group.status !== 'Cancelled' && group.status !== 'Delivered' && PURCHASE_REQUEST_STATUSES.filter(s => s !== 'Cancelled' && s !== group.status).map(s => (
                                            <button key={s} onClick={() => setStatus(s)} className="bg-brand-800 hover:bg-brand-900 text-white px-4 py-2 rounded-lg text-xs font-bold transition shadow-sm">Mark {s}</button>
                                        ))}
                                        {group.status !== 'Delivered' && group.status !== 'Cancelled' && (
                                            <button onClick={() => setStatus('Cancelled')} className="bg-white border border-red-300 text-red-600 hover:bg-red-50 px-4 py-2 rounded-lg text-xs font-bold transition">Cancel Request</button>
                                        )}
                                    </div>
                                </div>
                            ) : (
                                <div className="pt-3 border-t border-slate-100 text-sm space-y-1">
                                    <div><span className="text-slate-500">Platform: </span><span className="font-bold text-slate-800">{group.platform || '—'}</span></div>

                            <button onClick={() => onOpenRepair(repair)} className="bg-white border border-slate-300 hover:border-brand-500 hover:text-brand-700 text-slate-700 px-4 py-2 rounded text-xs font-bold transition shadow-sm">
                                Manage <i className="fa-solid fa-arrow-right ml-1"></i>
                            </button>

                    </tr>

                { label: 'Pending Diagnostic', count: repairs.filter(r => r.status === 'Diagnostic').length, icon: 'fa-microscope', color: 'text-indigo-600', bg: 'bg-indigo-50', border: 'border-l-indigo-400', status: 'Diagnostic' },
                { label: 'Awaiting PO', count: repairs.filter(r => r.status === 'Waiting PO').length, icon: 'fa-file-invoice', color: 'text-amber-600', bg: 'bg-amber-50', border: 'border-l-amber-400', status: 'Waiting PO' },
                { label: 'In Repair', count: repairs.filter(r => r.status === 'Repairing').length, icon: 'fa-screwdriver-wrench', color: 'text-cyan-600', bg: 'bg-cyan-50', border: 'border-l-cyan-400', status: 'Repairing' },
                { label: 'Pending QC', count: repairs.filter(r => r.status === 'QC').length, icon: 'fa-clipboard-check', color: 'text-purple-600', bg: 'bg-purple-50', border: 'border-l-purple-400', status: 'QC' },
                { label: 'Ready for Delivery', count: repairs.filter(r => r.status === 'Delivery Arrangement').length, icon: 'fa-truck-fast', color: 'text-orange-600', bg: 'bg-orange-50', border: 'border-l-orange-400', status: 'Delivery Arrangement' }
            ];

                            <div className="flex items-center gap-3">

                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">

                                <div className={`w-10 h-10 rounded-full flex items-center justify-center ${kpi.bg} ${kpi.color} text-base`}><i className={`fa-solid ${kpi.icon}`}></i></div>

                                ) : paginatedDisplay.map(entry => {

                                    const isCollapsed = collapsedGroups.has(entry.po);
                                    const groupAvg = Math.round(entry.items.reduce((sum, r) => sum + getProgressPercent(r), 0) / entry.items.length);
                                    return (

                                                        <div className="flex items-center gap-3 min-w-0">

                                                            <span className="font-mono text-xs font-black text-brand-800 bg-white border border-slate-300 rounded px-2 py-1">{entry.po}</span>

                        {totalPages > 1 && (

                                <div className="flex gap-2">

                                    <button disabled={pageSafe === totalPages} onClick={() => setCurrentPage(pageSafe + 1)} className="px-3 py-1.5 border border-slate-300 rounded text-xs font-bold text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition">Next <i className="fa-solid fa-chevron-right ml-1"></i></button>
                                </div>
                            </div>

        const NewRepairForm = ({ repairs, setRepairs, customers, setCustomers, navigateTo, setPreviewImage, userRole, currentUserName }) => {
                const [isNewCustomer, setIsNewCustomer] = useState(false);
                const todayStr = new Date().toISOString().split('T')[0];
                const [formData, setFormData] = useState({
                    dateReceived: todayStr, warrantyType: '', promisedDate: '', department: 'Electronic', customerCompany: '', customerName: '', customerPhone: '', customerEmail: '',
                    customerStreet: '', customerPostcode: '', customerCity: '', customerState: '', customerCountry: 'Malaysia',
                    customerPo: '', itemName: '', brand: '', model: '', serial: '', faultDescription: '',
                    photos: [], documents: []
                });

                const handlePhotoUpload = (e) => {
                    const files = Array.from(e.target.files);
                    files.forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (uploadEvent) => {
                            setFormData(prev => ({
                                ...prev,
                                photos: [...prev.photos, { url: uploadEvent.target.result, caption: file.name }]
                            }));
                        };
                        reader.readAsDataURL(file);
                    });
                    e.target.value = null;

                const handleSubmit = (e) => {

                        statusHistory: [{ status: 'Draft', timestamp: new Date().toISOString(), by: userRole, byName: currentUserName, type: 'status' }],

                return (

                                    <div className="md:col-span-2"><label className="block text-xs font-bold text-slate-700 mb-1">Equipment Description</label><input required type="text" value={formData.itemName} onChange={e => setFormData({...formData, itemName: e.target.value})} className="w-full border border-slate-300 rounded p-2.5 text-sm bg-white" placeholder="e.g., Main Logic Controller Module" /></div>

                                <div className="pt-4 border-t border-slate-200">

                                            <input type="file" accept="image/*" multiple onChange={handlePhotoUpload} className="hidden" />
                                        </label>

                                    <div className="space-y-3">
                                        {formData.photos.map((photo, idx) => (
                                            <div key={idx} className="flex gap-3 items-center bg-white p-3 border border-slate-200 rounded-lg shadow-sm">
                                                <div className="w-14 h-14 bg-slate-100 rounded border overflow-hidden shrink-0 cursor-pointer" onClick={() => setPreviewImage(photo.url)}>
                                                    <img src={photo.url} alt="Preview" className="w-full h-full object-cover" />
                                                </div>
                                                <input type="text" placeholder="Caption / Description" value={photo.caption} onChange={e => { const p = [...formData.photos]; p[idx].caption = e.target.value; setFormData({...formData, photos: p}); }} className="flex-1 border border-slate-300 rounded p-2 text-xs" />
                                                <button type="button" onClick={() => { const p = formData.photos.filter((_, i) => i !== idx); setFormData({...formData, photos: p}); }} className="text-red-600 hover:text-red-800 p-2"><i className="fa-solid fa-trash-can"></i></button>
                                            </div>
                                        ))}
                                    </div>

                                <div className="pt-4 border-t border-slate-200">
                                    <div className="flex justify-between items-center mb-3">
                                        <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider"><i className="fa-solid fa-folder-open mr-1.5"></i> Equipment Documents (Manuals, Programs, Schematics)</label>
                                        <label className="bg-brand-800 hover:bg-brand-900 text-white px-3 py-1.5 rounded text-xs font-bold transition cursor-pointer shadow-sm flex items-center">
                                            <i className="fa-solid fa-upload mr-1.5"></i> + Add Document
                                            <input type="file" multiple onChange={handleDocUpload} className="hidden" />
                                        </label>
                                    </div>
                                    <div className="space-y-3">
                                        {formData.documents.map((doc, idx) => (
                                            <div key={idx} className="flex gap-3 items-center bg-white p-3 border border-slate-200 rounded-lg shadow-sm">
                                                <div className="flex-1">
                                                    <span className="font-bold text-slate-800 text-xs block"><i className="fa-regular fa-file-lines text-brand-600 mr-2"></i> {doc.name}</span>
                                                    <span className="text-[10px] text-slate-500">{doc.size}</span>
                                                </div>
                                                <button type="button" onClick={() => { const d = formData.documents.filter((_, i) => i !== idx); setFormData({...formData, documents: d}); }} className="text-red-600 hover:text-red-800 p-2"><i className="fa-solid fa-trash-can"></i></button>

                            <div className="flex justify-end pt-4">
